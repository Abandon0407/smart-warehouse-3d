const panel = document.getElementById('panel');

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { S.introStart = performance.now(); S.playing = true; control.tDist = BASE_DIST * 1.4; }
  else if (k === 'i') { panel.classList.toggle('open'); }
  else if (k === 'h') {
    S.uiHide = !S.uiHide;
    const op = S.uiHide ? '0' : '1';
    ['hud', 'brand'].forEach(id => { const n = document.getElementById(id); if (n) n.style.opacity = op; });
  }
  else if (k === 'escape') { panel.classList.remove('open'); }
});
const _pclose = document.getElementById('pclose');

  </table>

  <h3>报警联动</h3>
  <div class="row2"><div class="k">一级（预警）</div><div class="v">温度或湿度越界 → 黄色泛光、板载灯橙色闪烁、OLED 边框黄闪</div></div>
  <div class="row2"><div class="k">二级（严重）</div><div class="v">超出阈值 +3℃ / +10%RH → 全屏红晕、蜂鸣器声波扩散、悬浮标签转红</div></div>
  <div class="row2"><div class="k">恢复</div><div class="v">数值回到阈值内自动解除，无需手动复位</div></div>

  <h3>操作</h3>
  <p><b>拖拽</b> 旋转 · <b>滚轮</b> 缩放 · <b>R</b> 重播组装 · <b>I</b> 本面板 · <b>H</b> 隐藏浮层</p>
  <p style="margin-top:16px;color:#5c7488;font-size:11px">下方数据面板可直接控制 K1/K2 与阈值，指令经 OneNET 下发到设备</p>
`);


/* ---------------------------------------------------------------------
   对外接口：dash.js 用 Stage.setLive() 把云端数据灌进三维场景
   --------------------------------------------------------------------- */
let _liveReady = false;
window.Stage = {
  setLive(o) {
    if (!o) return;
    if (typeof o.t === 'number') LIVE.t = o.t;
    if (typeof o.h === 'number') LIVE.h = o.h;
    LIVE.k1 = o.k1 ? 1 : 0;
    LIVE.k2 = o.k2 ? 1 : 0;
    LIVE.lv = o.lv || 0;
    LIVE.name = o.name || LIVE.name;
    LIVE.sub = o.sub || LIVE.sub;
    LIVE.why = o.why || LIVE.why;
    _liveReady = true;
  },
  /* 首次拿到数据时跳过组装动画，直接进入正式视角 */
  snap() {
    S.intro = 4; S.playing = false;
    if (_liveReady) { S.curT = LIVE.t; S.curH = LIVE.h; S.k1 = LIVE.k1; S.k2 = LIVE.k2; S.lv = LIVE.lv; S.fan = LIVE.k1; S.heat = LIVE.k2; }
    if (hintSprite) { hintSprite.material.opacity = 0; hintSprite.visible = false; }
  },
  get state() { return { S, LIVE }; }
};

/* =====================================================================
   11. 启动
   ===================================================================== */
function boot() {
  initCore();
  baseGroup = buildBase();
  buildRack();
  buildBoard();
  buildFan();
  buildHeater();
  buildWires();
  buildHint();

  S.introStart = performance.now();
  if (QS.get('intro') === '0') { S.intro = 4; S.playing = false; }

  updateCamera(0.016);
  renderer.render(scene, camera);
  setTimeout(() => document.getElementById('loader').classList.add('gone'), 240);

  window.__DBG = { scene, renderer, camera, S, LIVE };
  animate();
}

window.addEventListener('error', ev => {
  const el2 = document.getElementById('loader');
  if (!el2) return;
  el2.classList.remove('gone');
  el2.style.opacity = '1';
  el2.style.padding = '40px';
  el2.style.alignItems = 'flex-start';
  el2.innerHTML = '<pre style="color:#ff7a7a;font-size:12px;line-height:1.7;white-space:pre-wrap;letter-spacing:0">'
    + '[RUNTIME ERROR]\n' + (ev.message || '') + '\n' + ((ev.error && ev.error.stack) || '') + '</pre>';
});

try { boot(); } catch (err) {
  window.dispatchEvent(new ErrorEvent('error', { message: err.message, error: err }));
}

<script>
/* =====================================================================
   数据面板逻辑
   ---------------------------------------------------------------------
   · 每 5s 从 OneNET 拉一次（与手机 APP 同周期、同数据源）
   · 历史曲线先用 query-device-property-history 回填，再靠轮询追加
   · 报警判据与固件 appcfg 一致：越界=预警，超阈值 +3℃/+10%RH=严重
   ===================================================================== */
(function () {
  'use strict';

  var POLL_MS = 5000;            // 采集周期对齐固件（5s）
  var HISTORY_SPAN = 3 * 3600e3; // 内存里保留 3 小时
  var T_CRIT_DELTA = 3;          // 温度严重判据 +3℃
  var H_CRIT_DELTA = 10;         // 湿度严重判据 +10%RH

  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (v, d) { return (v === null || v === undefined || isNaN(v)) ? '--' : Number(v).toFixed(d === undefined ? 1 : d); };

  /* ------------------------------ 状态 ------------------------------ */
  var st = {
    temp: null, humi: null,
    k1: false, k2: false,
    mode: true,                       // true=自动
    tmin: null, tmax: null, hmin: null, hmax: null,
    online: null,
    ts: 0,
    lastSync: 0,
    fail: 0,
    rangeMin: 15,
    booted: false
  };
  var hist = [];                      // [{t, t_, h_}] 温度/湿度合并
  var busy = false;
  var chartHover = -1;

  /* ------------------------------ 小工具 ---------------------------- */
  var toastTimer = 0;
  function toast(msg, isErr) {
    var n = $('toast');
    n.textContent = msg;
    n.classList.toggle('err', !!isErr);
    n.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { n.classList.remove('show'); }, 2600);
  }

  function hhmmss(ts) {
    var d = new Date(ts);
    var p = function (x) { return String(x).padStart(2, '0'); };
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function hhmm(ts) {
    var d = new Date(ts);
    var p = function (x) { return String(x).padStart(2, '0'); };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* --------------------------- 报警等级 ----------------------------- */
  function evalAlarm() {
    var t = st.temp, h = st.humi;
    if (t === null || h === null) {
      return { lv: 0, name: '等待数据', sub: 'WAITING', why: '尚未取得云端数据', text: '等待数据', cls: 'mute' };
    }
    var lv = 0, why = [], name = '环境正常', sub = 'NORMAL', text = '环境正常', cls = 'ok';

    var tmin = st.tmin === null ? 0 : st.tmin;
    var tmax = st.tmax === null ? 60 : st.tmax;
    var hmin = st.hmin === null ? 0 : st.hmin;
    var hmax = st.hmax === null ? 100 : st.hmax;

    if (t < tmin) {
      lv = Math.max(lv, 1);
      why.push('T ' + fmt(t, 1) + '℃ < ' + tmin + '℃ 下限');
      name = '温度偏低'; sub = 'LOW TEMP';
    } else if (t > tmax) {
      lv = Math.max(lv, (t > tmax + T_CRIT_DELTA) ? 2 : 1);
      why.push('T ' + fmt(t, 1) + '℃ > ' + tmax + '℃ 上限');
      name = '温度偏高'; sub = 'HIGH TEMP';
    }

    if (h < hmin) {
      lv = Math.max(lv, 1);
      why.push('H ' + fmt(h, 0) + '% < ' + hmin + '% 下限');
      if (name === '环境正常') { name = '湿度偏低'; sub = 'LOW HUM'; }
    } else if (h > hmax) {
      lv = Math.max(lv, (h > hmax + H_CRIT_DELTA) ? 2 : 1);
      why.push('H ' + fmt(h, 0) + '% > ' + hmax + '% 上限');
      if (name === '环境正常') { name = '湿度偏高'; sub = 'HIGH HUM'; }
    }

    if (lv === 2) { name = '严重报警'; sub = 'CRITICAL'; text = '严重报警'; cls = 'crit'; }
    else if (lv === 1) { text = '环境预警'; cls = 'warn'; }

    if (lv === 0) why.push('温湿度均在阈值内 · 双路继电器待机');

    return {
      lv: lv, name: name, sub: sub, cls: cls, text: text,
      why: why.join('；')
    };
  }

  /* --------------------------- 渲染主流程 --------------------------- */
  function render() {
    var a = evalAlarm();

    /* --- 顶部状态 pill --- */
    var conn = $('connPill'), connT = $('connText');
    var onlineNow = st.online === true || (st.online === null && st.fail === 0 && st.ts);
    conn.className = 'pill ' + (st.fail >= 3 ? 'crit' : (st.online === false ? 'warn' : (st.lastSync ? 'ok' : 'mute')));
    connT.textContent = st.fail >= 3 ? '连接中断' : (st.online === false ? '设备离线' : (st.lastSync ? '云端在线' : '连接中…'));

    var mp = $('modePill');
    if (st.temp === null) { mp.className = 'pill mute'; $('modeText').textContent = '模式 --'; }
    else { mp.className = 'pill ' + (st.mode ? 'ok' : 'warn'); $('modeText').textContent = st.mode ? '自动模式' : '手动模式'; }

    var ap = $('alarmPill');
    ap.className = 'pill ' + a.cls;
    $('alarmText').textContent = a.text;

    $('devText').textContent = '设备 ' + OneNet.DEVICE_NAME;
    $('syncTime').textContent = st.lastSync ? ('最后同步 ' + hhmmss(st.lastSync)) : '最后同步 --:--:--';

    /* --- 传感器数字 --- */
    $('tempVal').textContent = st.temp === null ? '--' : fmt(st.temp, 1);
    $('humiVal').textContent = st.humi === null ? '--' : fmt(st.humi, 0);

    var tBad = st.temp !== null && (st.temp < (st.tmin === null ? 0 : st.tmin) || st.temp > (st.tmax === null ? 60 : st.tmax));
    var hBad = st.humi !== null && (st.humi < (st.hmin === null ? 0 : st.hmin) || st.humi > (st.hmax === null ? 100 : st.hmax));
    setTag('tempTag', tBad, a.lv === 2 && tBad);
    setTag('humiTag', hBad, a.lv === 2 && hBad);

    /* --- 阈值条（0~50℃ / 0~100%） --- */
    bar('temp', st.temp, st.tmin, st.tmax, 0, 50, 1);
    bar('humi', st.humi, st.hmin, st.hmax, 0, 100, 0);
    $('tempLo').textContent = '下限 ' + (st.tmin === null ? '--' : st.tmin) + '℃';
    $('tempHi').textContent = '上限 ' + (st.tmax === null ? '--' : st.tmax) + '℃';
    $('humiLo').textContent = '下限 ' + (st.hmin === null ? '--' : st.hmin) + '%';
    $('humiHi').textContent = '上限 ' + (st.hmax === null ? '--' : st.hmax) + '%';

    /* --- 运行统计 --- */
    var pn = document.getElementById('stPoints');
    if (pn) pn.textContent = String(hist.length);
    var ln = document.getElementById('stLast');
    if (ln) ln.textContent = st.ts ? hhmmss(st.ts) : '--:--:--';
    var on = document.getElementById('stOnline');
    if (on) {
      if (st.online === true) { on.textContent = '在线'; on.className = 'num ok'; }
      else if (st.online === false) { on.textContent = '离线'; on.className = 'num off'; }
      else { on.textContent = '未知'; on.className = 'num'; }
    }

    /* --- 继电器行 --- */
    relayRow('K1', st.k1);
    relayRow('K2', st.k2);

    /* --- 模式按钮 --- */
    $('btnAuto').classList.toggle('act', !!st.mode);
    $('btnManual').classList.toggle('act', !st.mode);
    $('ctlHint').textContent = st.mode ? '自动模式 · 由设备自动控制' : '手动模式 · 可远程通断';

    /* --- 阈值输入（不在输入态时才覆盖，避免打断用户编辑） --- */
    if (!/INPUT/.test(document.activeElement.tagName)) {
      setInp('inTMin', st.tmin); setInp('inTMax', st.tmax);
      setInp('inHMin', st.hmin); setInp('inHMax', st.hmax);
    }

    /* --- 三维联动 --- */
    if (window.Stage) {
      Stage.setLive({
        t: st.temp === null ? undefined : st.temp,
        h: st.humi === null ? undefined : st.humi,
        k1: st.k1, k2: st.k2,
        lv: a.lv, name: a.name, sub: a.sub, why: a.why
      });
      if (!st.booted && st.temp !== null) { st.booted = true; Stage.snap(); }
    }

    drawChart();
  }

  function setTag(id, bad, crit) {
    var n = $(id);
    n.textContent = bad ? (crit ? '严重' : '越界') : '正常';
    n.className = 'm-tag' + (bad ? ' hot' : '');
  }

  function setInp(id, v) {
    var n = $(id);
    if (!n) return;
    n.value = (v === null || v === undefined) ? '' : v;
  }

  function bar(key, val, lo, hi, min, max, dec) {
    var fill = $(key + 'Fill'), needle = $(key + 'Needle'), safe = $(key + 'Safe');
    if (val === null) { fill.style.width = '0'; needle.style.left = '0'; return; }
    var p = Math.max(0, Math.min(1, (val - min) / (max - min)));
    fill.style.width = (p * 100) + '%';
    needle.style.left = 'calc(' + (p * 100) + '% - 1px)';
    if (lo !== null && hi !== null) {
      var a = Math.max(0, Math.min(1, (lo - min) / (max - min)));
      var b = Math.max(0, Math.min(1, (hi - min) / (max - min)));
      safe.style.left = (a * 100) + '%';
      safe.style.width = ((b - a) * 100) + '%';
    }
  }

  function relayRow(k, on) {
    var row = $('row' + k);
    var sw = $('sw' + k);
    var label = $(k.toLowerCase() + 'State');
    if (row) row.classList.toggle('on', !!on);
    if (label) label.textContent = on ? '吸合 · 运行中' : '断开';
    if (sw && !sw.dataset.hang) sw.disabled = false;
  }

  /* ----------------------------- 曲线 ------------------------------ */
  var chart = $('chart'), cctx = chart.getContext('2d');
  var CW = 0, CH = 0, CDPR = 1;
  var PAD = { l: 34, r: 40, t: 10, b: 22 };

  function resizeChart() {
    var wrap = $('chartWrap');
    CW = Math.max(60, wrap.clientWidth);
    CH = Math.max(60, wrap.clientHeight);
    CDPR = Math.min(window.devicePixelRatio || 1, 2);
    chart.width = Math.round(CW * CDPR);
    chart.height = Math.round(CH * CDPR);
    cctx.setTransform(CDPR, 0, 0, CDPR, 0, 0);
    drawChart();
  }

  function windowPoints() {
    var now = Date.now();
    var from = now - st.rangeMin * 60000;
    var pts = hist.filter(function (p) { return p.t >= from; });
    if (pts.length < 2) {
      // 窗口内没数据（设备离线）：退回显示最近 3 小时里的最后一段
      var last = hist.length ? hist[hist.length - 1].t : 0;
      if (!last) return { pts: [], fallback: false };
      return { pts: hist.filter(function (p) { return p.t >= last - st.rangeMin * 60000; }), fallback: true };
    }
    return { pts: pts, fallback: false };
  }

  function drawChart() {
    if (!cctx || CW < 10) return;
    cctx.clearRect(0, 0, CW, CH);

    var w = windowPoints();
    var pts = w.pts;

    var x0 = PAD.l, x1 = CW - PAD.r, y0 = PAD.t, y1 = CH - PAD.b;
    var iw = x1 - x0, ih = y1 - y0;
    if (iw <= 10 || ih <= 10) return;

    /* 网格 + 左右轴刻度（左=温度 0~50，右=湿度 0~100） */
    cctx.font = '10px Consolas,monospace';
    cctx.textBaseline = 'middle';
    for (var i = 0; i <= 5; i++) {
      var yy = y0 + ih * i / 5;
      cctx.strokeStyle = 'rgba(120,170,220,.1)';
      cctx.lineWidth = 1;
      cctx.beginPath(); cctx.moveTo(x0, yy + .5); cctx.lineTo(x1, yy + .5); cctx.stroke();

      var tv = 50 - i * 10;
      cctx.fillStyle = 'rgba(255,138,76,.68)';
      cctx.textAlign = 'right';
      cctx.fillText(tv.toFixed(0) + '°', x0 - 6, yy);

      var hv = 100 - i * 20;
      cctx.fillStyle = 'rgba(79,176,255,.68)';
      cctx.textAlign = 'left';
      cctx.fillText(hv.toFixed(0) + '%', x1 + 7, yy);
    }

    if (!pts.length) {
      $('chartEmpty').classList.remove('hide');
      $('chartEmpty').textContent = hist.length ? '当前时段无数据 · 可切换更长的时间范围' : '等待设备上报数据…';
      return;
    }
    $('chartEmpty').classList.toggle('hide', pts.length >= 1);

    var tA = pts[0].t, tB = pts[pts.length - 1].t;
    if (tB - tA < 60000) { var mid = (tA + tB) / 2; tA = mid - 30000; tB = mid + 30000; }
    var X = function (t) { return x0 + (t - tA) / (tB - tA) * iw; };
    var YT = function (v) { return y1 - Math.max(0, Math.min(50, v)) / 50 * ih; };
    var YH = function (v) { return y1 - Math.max(0, Math.min(100, v)) / 100 * ih; };

    /* 温度安全带 */
    if (st.tmin !== null && st.tmax !== null) {
      var by1 = YT(st.tmax), by2 = YT(st.tmin);
      cctx.fillStyle = 'rgba(53,224,176,.05)';
      cctx.fillRect(x0, by1, iw, Math.max(1, by2 - by1));
    }
    /* 温度阈值虚线 */
    dashed(x0, x1, YT(st.tmax), 'rgba(255,191,60,.45)');
    dashed(x0, x1, YT(st.tmin), 'rgba(255,191,60,.45)');
    /* 湿度阈值虚线 */
    dashedD(x0, x1, YH(st.hmax), 'rgba(79,176,255,.3)');
    dashedD(x0, x1, YH(st.hmin), 'rgba(79,176,255,.3)');

    /* 面积 + 折线 */
    /* 温湿度是两次独立上报，时间戳不完全对齐，合并后会有单边缺失。
       必须按字段各自过滤，否则缺失点会被画成 0（就是之前那条锯齿）。 */
    var pT = pts.filter(function (p) { return p.v !== null && p.v !== undefined; });
    var pH = pts.filter(function (p) { return p.v_h !== null && p.v_h !== undefined; });

    if (pT.length === 1) {
      cctx.beginPath(); cctx.arc(X(pT[0].t), YT(pT[0].v), 4, 0, 6.3);
      cctx.fillStyle = '#ff8a4c'; cctx.fill();
    } else if (pT.length > 1) {
      area(pT, X, YT, 'rgba(255,138,76,.16)', 'v');
      line(pT, X, YT, '#ff8a4c', 1.9, 'v');
      var lpT = pT[pT.length - 1];
      dot(X(lpT.t), YT(lpT.v), '#ff8a4c');
    }
    if (pH.length === 1) {
      cctx.beginPath(); cctx.arc(X(pH[0].t), YH(pH[0].v_h), 4, 0, 6.3);
      cctx.fillStyle = '#4fb0ff'; cctx.fill();
    } else if (pH.length > 1) {
      area(pH, X, YH, 'rgba(79,176,255,.13)', 'v_h');
      line(pH, X, YH, '#4fb0ff', 1.9, 'v_h');
      var lpH = pH[pH.length - 1];
      dot(X(lpH.t), YH(lpH.v_h), '#4fb0ff');
    }

    /* 时间刻度 */
    cctx.textAlign = 'center';
    cctx.textBaseline = 'top';
    cctx.fillStyle = 'rgba(150,178,206,.8)';
    cctx.font = '10px Consolas,monospace';
    var n = Math.min(6, Math.max(2, Math.floor(iw / 84)));
    var shortSpan = (tB - tA) < 5 * 60000;
    for (var k = 0; k <= n; k++) {
      var tt = tA + (tB - tA) * k / n;
      var xx = X(tt);
      cctx.fillText(shortSpan ? hhmmss(tt) : hhmm(tt), Math.max(26, Math.min(CW - 26, xx)), y1 + 6);
    }
    cctx.textBaseline = 'middle';

    if (w.fallback) {
      cctx.textAlign = 'left';
      cctx.fillStyle = 'rgba(255,191,60,.8)';
      cctx.fillText('设备最近无新数据，显示历史片段', x0 + 4, y0 + 8);
    }

    chartHover = -1;
    chart._map = { x0: x0, x1: x1, tA: tA, tB: tB, pts: pts, X: X, YT: YT, YH: YH };
  }

  function dashed(xa, xb, y, color) {
    if (!isFinite(y)) return;
    cctx.save();
    cctx.setLineDash([4, 4]);
    cctx.strokeStyle = color; cctx.lineWidth = 1;
    cctx.beginPath(); cctx.moveTo(xa, y); cctx.lineTo(xb, y); cctx.stroke();
    cctx.restore();
  }
  function dashedD(xa, xb, y, color) {
    if (!isFinite(y)) return;
    cctx.save();
    cctx.setLineDash([2, 5]);
    cctx.strokeStyle = color; cctx.lineWidth = 1;
    cctx.beginPath(); cctx.moveTo(xa, y); cctx.lineTo(xb, y); cctx.stroke();
    cctx.restore();
  }

  function line(pts, X, Y, color, lw, key) {
    key = key || 'v';
    cctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var x = X(pts[i].t), y = Y(pts[i][key]);
      if (i === 0) cctx.moveTo(x, y); else cctx.lineTo(x, y);
    }
    cctx.strokeStyle = color; cctx.lineWidth = lw;
    cctx.lineJoin = 'round'; cctx.lineCap = 'round';
    cctx.shadowColor = color; cctx.shadowBlur = 6;
    cctx.stroke();
    cctx.shadowBlur = 0;
  }

  function area(pts, X, Y, color, key) {
    key = key || 'v';
    var y1 = CH - PAD.b;
    cctx.beginPath();
    cctx.moveTo(X(pts[0].t), y1);
    for (var i = 0; i < pts.length; i++) cctx.lineTo(X(pts[i].t), Y(pts[i][key]));
    cctx.lineTo(X(pts[pts.length - 1].t), y1);
    cctx.closePath();
    cctx.fillStyle = color;
    cctx.fill();
  }

  function dot(x, y, color) {
    cctx.beginPath();
    cctx.arc(x, y, 2.6, 0, Math.PI * 2);
    cctx.fillStyle = color; cctx.fill();
    cctx.beginPath();
    cctx.arc(x, y, 5.4, 0, Math.PI * 2);
    cctx.strokeStyle = color; cctx.globalAlpha = .35; cctx.lineWidth = 1; cctx.stroke();
    cctx.globalAlpha = 1;
  }

  /* 曲线悬停 */
  chart.addEventListener('mousemove', function (e) {
    var m = chart._map;
    var tip = $('chartTip');
    if (!m || !m.pts.length) { tip.style.opacity = 0; return; }
    var r = chart.getBoundingClientRect();
    var mx = e.clientX - r.left;
    if (mx < m.x0 - 4 || mx > m.x1 + 4) { tip.style.opacity = 0; return; }
    var t = m.tA + (mx - m.x0) / (m.x1 - m.x0) * (m.tB - m.tA);
    var best = 0, bd = Infinity;
    for (var i = 0; i < m.pts.length; i++) {
      if (m.pts[i].v === null && m.pts[i].v_h === null) continue;
      var d = Math.abs(m.pts[i].t - t);
      if (d < bd) { bd = d; best = i; }
    }
    var p = m.pts[best];
    tip.innerHTML = hhmmss(p.t) + '<br><b>' + fmt(p.v, 1) + ' ℃</b> · <u>' + fmt(p.v_h, 0) + ' %RH</u>';
    tip.style.left = Math.max(60, Math.min(CW - 60, m.X(p.t))) + 'px';
    tip.style.top = Math.min(m.YT(p.v === null ? 50 : p.v), m.YH(p.v_h === null ? 100 : p.v_h)) + 'px';
    tip.style.opacity = 1;

    drawChart();
    var yy = m.YT(p.v === null ? 0 : p.v), yy2 = m.YH(p.v_h === null ? 0 : p.v_h);
    cctx.save();
    cctx.setLineDash([3, 3]);
    cctx.strokeStyle = 'rgba(200,220,240,.3)';
    cctx.beginPath(); cctx.moveTo(m.X(p.t), PAD.t); cctx.lineTo(m.X(p.t), CH - PAD.b); cctx.stroke();
    cctx.restore();
    if (p.v !== null) { cctx.beginPath(); cctx.arc(m.X(p.t), yy, 3.6, 0, 6.3); cctx.fillStyle = '#ff8a4c'; cctx.fill(); }
    if (p.v_h !== null) { cctx.beginPath(); cctx.arc(m.X(p.t), yy2, 3.6, 0, 6.3); cctx.fillStyle = '#4fb0ff'; cctx.fill(); }
  });
  chart.addEventListener('mouseleave', function () {
    $('chartTip').style.opacity = 0;
    drawChart();
  });

  /* --------------------------- 历史回填 ---------------------------- */
  function mergeHist(list, key) {
    var map = {};
    hist.forEach(function (p) { map[p.t] = p; });
    list.forEach(function (o) {
      var p = map[o.t] || { t: o.t, v: null, v_h: null };
      if (key === 'temp') p.v = o.v; else p.v_h = o.v;
      map[o.t] = p;
    });
    hist = Object.keys(map).map(function (k) { return map[k]; })
      .sort(function (a, b) { return a.t - b.t; });
    // 只留 3 小时
    var cut = Date.now() - HISTORY_SPAN;
    hist = hist.filter(function (p) { return p.t >= cut; });
  }

  async function backfill() {
    var now = Date.now();
    var from = now - HISTORY_SPAN;
    try {
      var r = await Promise.all([
        OneNet.getHistory('temp', from, now, 1000).catch(function () { return []; }),
        OneNet.getHistory('humi', from, now, 1000).catch(function () { return []; })
      ]);
      if (r[0].length) mergeHist(r[0], 'temp');
      if (r[1].length) mergeHist(r[1], 'humi');
      if (r[0].length || r[1].length) drawChart();
      return r[0].length + r[1].length;
    } catch (e) { return 0; }
  }

  /* ----------------------------- 轮询 ------------------------------ */
  async function poll(manual) {
    if (busy) return;
    busy = true;
    if (manual) $('btnRefresh').textContent = '刷新中…';

    try {
      var d = await OneNet.getLatest();
      st.temp = d.temp; st.humi = d.humi;
      st.k1 = !!d.k1; st.k2 = !!d.k2;
      st.mode = d.mode === null ? st.mode : !!d.mode;
      if (d.tmin !== null) st.tmin = d.tmin;
      if (d.tmax !== null) st.tmax = d.tmax;
      if (d.hmin !== null) st.hmin = d.hmin;
      if (d.hmax !== null) st.hmax = d.hmax;
      st.online = d.online;
      st.ts = d.ts || st.ts;
      st.lastSync = Date.now();
      st.fail = 0;

      // 追加进历史
      if (st.temp !== null || st.humi !== null) {
        var t = st.ts || Date.now();
        var exist = hist.length && Math.abs(hist[hist.length - 1].t - t) < 1500;
        if (!exist) {
          hist.push({ t: t, v: st.temp, v_h: st.humi });
          var cut = Date.now() - HISTORY_SPAN;
          hist = hist.filter(function (p) { return p.t >= cut; });
        } else {
          hist[hist.length - 1].v = st.temp;
          hist[hist.length - 1].v_h = st.humi;
        }
      }

      badge(true, d.online);
      render();
      if (manual) toast('已刷新 · ' + hhmmss(st.lastSync));
    } catch (e) {
      st.fail++;
      badge(false);
      render();
      if (manual || st.fail === 1) toast('云端连接失败：' + e.message, true);
    } finally {
      busy = false;
      if (manual) $('btnRefresh').textContent = '立即刷新';
    }
  }

  function badge(ok, online) {
    var b = $('srcBadge');
    b.classList.remove('live', 'off');
    if (!ok) { b.classList.add('off'); $('srcText').textContent = '云端连接异常 · 正在重试'; }
    else if (online === false) { b.classList.add('off'); $('srcText').textContent = '设备离线 · 显示最后一次上报'; }
    else { b.classList.add('live'); $('srcText').textContent = 'OneNET 实时数据 · 5s 刷新'; }
  }

  /* ----------------------------- 控制 ------------------------------ */
  async function sendProps(params, okMsg) {
    try {
      var r = await OneNet.setProps(params);
      if (r.ok) {
        toast(okMsg + '（已下发，设备在线时生效）');
        setTimeout(function () { poll(false); }, 1200);
      } else if (r.code === 10411) {
        toast('设备当前离线，指令已记录但无法送达设备', true);
      } else {
        toast('下发失败：' + r.msg, true);
      }
    } catch (e) { toast('下发异常：' + e.message, true); }
  }

  function bindSwitch(k) {
    var sw = $('sw' + k);
    sw.addEventListener('click', function () {
      if (sw.disabled) return;
      var cur = k === 'K1' ? st.k1 : st.k2;
      var next = !cur;
      var params = {};
      params[k === 'K1' ? 'k1' : 'k2'] = next;

      // 乐观更新
      if (k === 'K1') st.k1 = next; else st.k2 = next;
      render();

      sw.dataset.hang = '1'; sw.disabled = true;
      setTimeout(function () { sw.dataset.hang = ''; sw.disabled = false; }, 2500);

      if (st.mode) toast('当前为自动模式，设备可能按阈值自动覆盖该状态');
      sendProps(params, (k === 'K1' ? '通风风扇' : '加热片') + (next ? ' 已开启' : ' 已关闭'));
    });
  }

  function bindMode(auto) {
    st.mode = auto;
    render();
    sendProps({ mode: auto }, auto ? '已切换为自动模式' : '已切换为手动模式');
  }

  /* 阈值保存 */
  function bindThreshold() {
    $('btnSaveTh').addEventListener('click', function () {
      var v = {
        temp_min: parseInt($('inTMin').value, 10),
        temp_max: parseInt($('inTMax').value, 10),
        humi_min: parseInt($('inHMin').value, 10),
        humi_max: parseInt($('inHMax').value, 10)
      };
      var bad = [];
      if (isNaN(v.temp_min) || isNaN(v.temp_max) || isNaN(v.humi_min) || isNaN(v.humi_max)) bad.push('四项都必须填数字');
      else {
        if (v.temp_min >= v.temp_max) bad.push('温度下限须小于上限');
        if (v.humi_min >= v.humi_max) bad.push('湿度下限须小于上限');
        if (v.temp_min < -10 || v.temp_max > 60) bad.push('温度阈值超出 -10~60℃');
        if (v.humi_min < 0 || v.humi_max > 100) bad.push('湿度阈值超出 0~100%');
      }
      if (bad.length) { toast(bad[0], true); return; }

      st.tmin = v.temp_min; st.tmax = v.temp_max;
      st.hmin = v.humi_min; st.hmax = v.humi_max;
      render();
      sendProps(v, '阈值已保存');
    });
  }

  /* 时间窗口切换 */
  function bindRange() {
    Array.prototype.forEach.call($('rangeBtns').children, function (b) {
      b.addEventListener('click', function () {
        Array.prototype.forEach.call($('rangeBtns').children, function (x) { x.classList.remove('act'); });
        b.classList.add('act');
        st.rangeMin = parseInt(b.dataset.min, 10);
        drawChart();
      });
    });
  }

  /* ------------------------------ 启动 ----------------------------- */
  function bindUI() {
    bindSwitch('K1'); bindSwitch('K2');
    bindThreshold(); bindRange();

    $('btnAuto').addEventListener('click', function () { bindMode(true); });
    $('btnManual').addEventListener('click', function () { bindMode(false); });
    $('btnRefresh').addEventListener('click', function () { poll(true); backfill(); });

    var openPanel = function () { $('panel').classList.add('open'); };
    $('btnInfo2').addEventListener('click', openPanel);
    $('btnReset').addEventListener('click', function () {
      if (window.Stage && window.__DBG) {
        window.__DBG.S.introStart = performance.now();
        window.__DBG.S.playing = true;
      }
    });

    window.addEventListener('resize', function () { setTimeout(resizeChart, 60); });
  }

  function init() {
    bindUI();
    setTimeout(resizeChart, 120);

    // 先回填历史，再开始轮询（两者互不阻塞）
    backfill().then(function (n) {
      if (n) drawChart();
    });
    poll(false);

    setInterval(function () { poll(false); }, POLL_MS);
    // 每 15 分钟补一次历史，补上页面后台时漏掉的点
    setInterval(backfill, 15 * 60000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  /* 暴露给调试 */
  window.Dash = { st: st, hist: function () { return hist; }, poll: poll, drawChart: drawChart };
})();

</script>
</body>
