<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智能仓储温湿度监控系统 · 三维实时监控大屏</title>
<!-- 单文件版：业务脚本内联，three.js 走 CDN -->
<style>
  :root{
    --bg:#06080d;
    --bg2:#0a0f17;
    --panel:rgba(13,19,28,.82);
    --panel2:rgba(17,25,36,.7);
    --line:rgba(120,170,220,.14);
    --line2:rgba(120,170,220,.28);
    --txt:#dbe8f6;
    --txt2:#8ea6bf;
    --txt3:#5d748a;
    --ok:#35e0b0;
    --warn:#ffbf3c;
    --crit:#ff3b46;
    --temp:#ff8a4c;
    --humi:#4fb0ff;
    --fan:#4fd0ff;
    --heat:#ff9a3c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .num{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* ================= 上半：三维现场 ================= */
  #stage{position:relative;flex:1 1 52%;min-height:300px;overflow:hidden;background:#06080d}
  #c{display:block;width:100%;height:100%;cursor:grab;-webkit-tap-highlight-color:transparent;user-select:none}
  body.dragging #c{cursor:grabbing}
  #vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
       background:radial-gradient(ellipse 64% 60% at 50% 48%, rgba(255,40,52,0) 42%, rgba(255,28,40,.55) 100%)}

  #brand{position:absolute;left:26px;top:22px;pointer-events:none;transition:opacity .35s}
  #brand h1{font-size:15px;font-weight:600;letter-spacing:.14em;margin-bottom:6px;color:#eaf4ff}
  #brand p{font-size:10.5px;color:#6d8299;letter-spacing:.16em;font-family:monospace}

  #hud{position:absolute;right:22px;top:20px;padding:11px 15px;border-radius:14px;
       background:rgba(10,16,25,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
       border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.4);
       min-width:190px;transition:opacity .35s,border-color .3s}
  #hud .row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  #dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto;
       box-shadow:0 0 0 3px rgba(53,224,176,.15),0 0 12px rgba(53,224,176,.9);transition:all .2s}
  #stName{font-size:12.5px;color:#eaf4ff;letter-spacing:.08em;font-weight:600}
  #hud .val{display:flex;gap:14px;font-family:monospace;font-size:11px;color:#8ea6bf}
  #hud .val b{color:#d6e6f7;font-weight:600;font-size:14px}
  #hud .rel{display:flex;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(120,170,220,.12)}
  .chip{padding:2px 7px;border-radius:5px;font-family:monospace;font-size:10px;letter-spacing:.05em;
        background:rgba(120,170,220,.09);color:#6d8299;border:1px solid rgba(120,170,220,.12);transition:.25s;white-space:nowrap}
  .chip.on{background:rgba(79,208,255,.16);color:#6cd6ff;border-color:rgba(79,208,255,.4);
           box-shadow:0 0 12px rgba(79,208,255,.28)}
  .chip.on.cool{background:rgba(255,154,60,.16);color:#ffb570;border-color:rgba(255,154,60,.42);
           box-shadow:0 0 12px rgba(255,154,60,.3)}

  /* 3D 区右下角工具条 */
  #stageTools{position:absolute;right:22px;bottom:14px;display:flex;gap:7px;transition:opacity .35s}
  #stageTools button{
    border:1px solid var(--line);background:rgba(10,16,25,.7);color:#8ea6bf;
    backdrop-filter:blur(10px);padding:6px 11px;border-radius:8px;font-size:11px;font-family:inherit;
    cursor:pointer;letter-spacing:.05em;transition:.2s}
  #stageTools button:hover{color:#dbe8f6;border-color:var(--line2);background:rgba(20,30,44,.85)}
  #srcBadge{position:absolute;left:26px;bottom:14px;font-size:10.5px;color:#4f6478;font-family:monospace;
            letter-spacing:.08em;transition:opacity .35s;display:flex;align-items:center;gap:7px}
  #srcBadge i{width:6px;height:6px;border-radius:50%;background:#5d748a;display:inline-block}
  #srcBadge.live i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  #srcBadge.off i{background:var(--crit);box-shadow:0 0 8px var(--crit)}

  /* ================= 下半：数据面板 ================= */
  #dash{flex:0 1 auto;max-height:48%;background:linear-gradient(180deg,#0a0f17,#070a11);
        border-top:1px solid rgba(120,170,220,.16);padding:10px 16px 12px;overflow-y:auto;
        box-shadow:0 -14px 40px rgba(0,0,0,.5)}
  #dash::-webkit-scrollbar{width:6px;height:6px}
  #dash::-webkit-scrollbar-thumb{background:rgba(120,170,220,.24);border-radius:9px}

  .dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px;flex-wrap:wrap}
  .dh-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;
        font-size:11.5px;letter-spacing:.05em;background:var(--panel2);border:1px solid var(--line);color:var(--txt2)}
  .pill i{width:6px;height:6px;border-radius:50%;background:var(--txt3);flex:0 0 auto;transition:.2s}
  .pill.ok{color:#5fe8c7;border-color:rgba(53,224,176,.3);background:rgba(53,224,176,.08)}
  .pill.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .pill.warn{color:#ffca57;border-color:rgba(255,191,60,.34);background:rgba(255,191,60,.09)}
  .pill.warn i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .pill.crit{color:#ff6a72;border-color:rgba(255,59,70,.36);background:rgba(255,59,70,.1);animation:blink 1.05s infinite}
  .pill.crit i{background:var(--crit);box-shadow:0 0 8px var(--crit)}
  .pill.mute i{background:var(--txt3)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

  .dh-right{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--txt3)}
  .dh-right .t{font-family:monospace;letter-spacing:.06em}
  .dh-right button{border:1px solid var(--line);background:transparent;color:var(--txt2);
    padding:5px 10px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit;transition:.2s}
  .dh-right button:hover{color:#dbe8f6;border-color:var(--line2)}

  .dash-body{display:grid;grid-template-columns:196px minmax(280px,1fr) 268px;gap:11px;align-items:stretch}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
        position:relative;overflow:hidden}
  .card::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}

  /* 指标卡 */
  .metric{padding:9px 13px 10px}
  .metric + .metric{margin-top:9px}
  .m-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .m-name{font-size:11.5px;color:var(--txt2);letter-spacing:.1em}
  .m-tag{font-size:10px;padding:1.5px 6px;border-radius:5px;font-family:monospace;
         background:rgba(120,170,220,.1);color:var(--txt3)}
  .m-tag.hot{background:rgba(255,59,70,.14);color:#ff7a80}
  .m-val{display:flex;align-items:baseline;gap:3px;margin:1px 0 5px}
  .m-val b{font-family:"JetBrains Mono",Consolas,monospace;font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
  .m-val span{font-size:12px;color:var(--txt3)}
  #cardTemp .m-val b{color:var(--temp)}
  #cardHumi .m-val b{color:var(--humi)}
  .m-bar{position:relative;height:5px;border-radius:3px;background:rgba(120,170,220,.1);overflow:visible}
  .m-bar .safe{position:absolute;top:0;bottom:0;background:rgba(53,224,176,.22);border-radius:3px}
  .m-bar .fill{position:absolute;top:0;bottom:0;width:0;background:var(--temp);border-radius:3px;transition:width .5s,left .5s}
  #cardHumi .m-bar .fill{background:var(--humi)}
  .m-bar .needle{position:absolute;top:-2.5px;bottom:-2.5px;width:2px;background:#eaf4ff;border-radius:2px;
                 box-shadow:0 0 6px rgba(234,244,255,.8);transition:left .5s}
  .m-lim{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--txt3);font-family:monospace}

  /* 运行统计卡 */
  .stat-card{padding:8px 12px;margin-top:9px;display:flex;flex-direction:column;justify-content:center;gap:5px}
  .st-row{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--txt3);letter-spacing:.03em}
  .st-row b{font-size:11px;color:#b9cadb;font-weight:600}
  .st-row b.ok{color:var(--ok)} .st-row b.off{color:var(--warn)}

  /* 曲线卡 */
  .chart-card{display:flex;flex-direction:column;padding:9px 12px 7px}
  .c-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:10px}
  .c-title{font-size:11.5px;color:var(--txt2);letter-spacing:.1em;display:flex;align-items:center;gap:14px}
  .legend{display:flex;gap:12px;font-size:10.5px;color:var(--txt3);letter-spacing:.04em}
  .legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
  .legend em::before{content:"";width:12px;height:2.5px;border-radius:2px;background:currentColor}
  .lg-t{color:var(--temp)} .lg-h{color:var(--humi)}
  .c-range{display:flex;gap:5px}
  .c-range button{border:1px solid var(--line);background:transparent;color:var(--txt3);font-size:10px;
    padding:2.5px 7px;border-radius:6px;cursor:pointer;font-family:inherit;transition:.2s}
  .c-range button.act{color:#8ff0d6;border-color:rgba(53,224,176,.35);background:rgba(53,224,176,.1)}
  #chartWrap{position:relative;flex:1 1 auto;min-height:104px}
  #chart{display:block;position:absolute;inset:0;width:100%;height:100%}
  #chartTip{position:absolute;pointer-events:none;opacity:0;transition:opacity .15s;
    background:rgba(8,13,20,.94);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;
    font-size:11px;font-family:monospace;color:#dbe8f6;white-space:nowrap;z-index:5;
    box-shadow:0 6px 20px rgba(0,0,0,.5);transform:translate(-50%,-118%)}
  #chartTip b{color:var(--temp)} #chartTip u{text-decoration:none;color:var(--humi)}
  #chartEmpty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;color:var(--txt3);letter-spacing:.1em;pointer-events:none}
  #chartEmpty.hide{display:none}

  /* 控制卡 */
  .ctl-card{padding:9px 12px 10px}
  .card-h{font-size:11.5px;color:var(--txt2);letter-spacing:.1em;margin-bottom:7px;display:flex;
          align-items:center;justify-content:space-between}
  .card-h span{font-size:10px;color:var(--txt3);letter-spacing:.02em}

  .relay{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:10px;
         background:rgba(120,170,220,.05);border:1px solid transparent;transition:.25s;margin-bottom:7px}
  .relay:last-child{margin-bottom:0}
  .relay.on{border-color:rgba(79,208,255,.3);background:rgba(79,208,255,.08)}
  .relay.on.heat-on{border-color:rgba(255,154,60,.32);background:rgba(255,154,60,.08)}
  .r-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
        background:rgba(120,170,220,.1);color:#6d8299;transition:.25s}
  .relay.on .r-ic{background:rgba(79,208,255,.16);color:#6cd6ff;box-shadow:0 0 14px rgba(79,208,255,.22)}
  .relay.on.heat-on .r-ic{background:rgba(255,154,60,.16);color:#ffb570;box-shadow:0 0 14px rgba(255,154,60,.22)}
  .r-txt{flex:1;min-width:0}
  .r-txt b{display:block;font-size:12px;font-weight:600;color:#cfdeee;letter-spacing:.04em}
  .r-txt small{font-size:10px;color:var(--txt3);font-family:monospace}
  .r-sw{position:relative;width:38px;height:21px;border-radius:99px;background:rgba(120,170,220,.16);
        border:0;cursor:pointer;flex:0 0 auto;transition:.25s;padding:0}
  .r-sw::after{content:"";position:absolute;left:2.5px;top:2.5px;width:16px;height:16px;border-radius:50%;
        background:#8ea6bf;transition:.25s}
  .relay.on .r-sw{background:rgba(79,208,255,.5)}
  .relay.on .r-sw::after{left:19.5px;background:#fff}
  .relay.on.heat-on .r-sw{background:rgba(255,154,60,.55)}
  .r-sw:disabled{opacity:.4;cursor:not-allowed}

  .mode-row{display:flex;gap:6px;margin-top:7px}
  .mode-row button{flex:1;border:1px solid var(--line);background:transparent;color:var(--txt3);
    padding:5px 4px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:.06em;transition:.2s}
  .mode-row button:hover{color:#c3d8ee;border-color:var(--line2)}
  .mode-row button.act{color:#8ff0d6;border-color:rgba(53,224,176,.4);background:rgba(53,224,176,.12)}
  .mode-row button.act.manual{color:#ffd08a;border-color:rgba(255,191,60,.4);background:rgba(255,191,60,.12)}

  /* 阈值 */
  .th-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .th-item{background:rgba(120,170,220,.05);border:1px solid transparent;border-radius:8px;padding:4px 8px;transition:.2s}
  .th-item:focus-within{border-color:rgba(79,208,255,.34);background:rgba(79,208,255,.06)}
  .th-item label{display:block;font-size:10px;color:var(--txt3);margin-bottom:2px;letter-spacing:.04em}
  .th-item .inp{display:flex;align-items:baseline;gap:2px}
  .th-item input{width:100%;border:0;background:transparent;color:#dbe8f6;font-size:15px;font-weight:600;
    font-family:"JetBrains Mono",Consolas,monospace;outline:none;padding:0}
  .th-item input::-webkit-outer-spin-button,.th-item input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .th-item i{font-style:normal;font-size:10px;color:var(--txt3);flex:0 0 auto}
  .th-save{width:100%;margin-top:7px;border:1px solid rgba(53,224,176,.32);background:rgba(53,224,176,.1);
    color:#5fe8c7;padding:7px;border-radius:9px;font-size:11.5px;font-family:inherit;letter-spacing:.1em;
    cursor:pointer;transition:.2s}
  .th-save:hover{background:rgba(53,224,176,.18)}
  .th-save:disabled{opacity:.45;cursor:not-allowed}

  /* 说明面板（沿用 3D 版样式） */
  #panel{position:fixed;top:0;right:0;width:min(430px,92vw);height:100%;overflow-y:auto;
       background:rgba(8,12,20,.96);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
       border-left:1px solid rgba(120,170,220,.14);padding:34px 30px 60px;
       transform:translateX(103%);transition:transform .5s cubic-bezier(.22,.8,.24,1);
       color:#a8bcd2;font-size:12.5px;line-height:1.92;z-index:30}
  #panel.open{transform:translateX(0)}
  #panel h2{font-size:15px;color:#e8f2ff;letter-spacing:.08em;font-weight:600;margin-bottom:14px}
  #panel h3{font-size:12px;color:#5fd6c4;letter-spacing:.14em;margin:26px 0 10px;font-weight:600}
  #panel p{margin-bottom:9px}
  #panel b{color:#dbe9f8;font-weight:600}
  #panel .row2{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(120,170,220,.12)}
  #panel .k{flex:0 0 104px;color:#7f96ae;font-size:11.5px}
  #panel .v{flex:1;color:#c3d6e8;font-size:11.5px}
  #panel .close{position:absolute;top:20px;right:22px;width:26px;height:26px;border-radius:50%;
       border:1px solid rgba(140,180,230,.2);background:transparent;color:#9fb6cd;cursor:pointer;
       font-size:14px;line-height:1;transition:.2s}
  #panel .close:hover{background:rgba(140,180,230,.12);color:#fff}
  #panel::-webkit-scrollbar{width:4px}
  #panel::-webkit-scrollbar-thumb{background:rgba(120,170,220,.25);border-radius:9px}
  #panel table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
  #panel th{color:#6d8299;font-weight:500;text-align:left;padding:5px 4px;border-bottom:1px solid rgba(120,170,220,.16);font-size:10.5px}
  #panel td{padding:6px 4px;border-bottom:1px dashed rgba(120,170,220,.1);color:#c3d6e8;vertical-align:top}
  #panel td.c{color:#8ea6bf;font-family:monospace;font-size:10.5px}

  #loader{position:absolute;inset:0;background:#07090f;display:flex;align-items:center;justify-content:center;
       z-index:20;transition:opacity .9s;color:#3f5b73;font-size:11px;letter-spacing:.34em}
  #loader.gone{opacity:0;pointer-events:none}

  /* 操作提示（toast） */
  #toast{position:fixed;left:50%;bottom:calc(100% - 100vh + 26px);transform:translate(-50%,20px);
    background:rgba(8,13,20,.95);border:1px solid var(--line2);color:#dbe8f6;font-size:12px;
    padding:9px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:80vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.err{border-color:rgba(255,59,70,.45);color:#ff9aa0}

  /* ================= 自适应 ================= */
  @media (max-width:1180px){
    .dash-body{grid-template-columns:180px minmax(220px,1fr) 250px}
  }
  @media (max-width:980px){
    .dash-body{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
    .chart-card{grid-column:1 / -1;order:-1;min-height:170px}
    #dash{padding:10px 12px 16px}
  }
  @media (max-width:760px){
    /* 小屏改成整页滚动：3D 固定高度，数据面板自然向下铺开 */
    html,body{overflow:auto;height:auto}
    #app{height:auto;min-height:100dvh}
    #stage{flex:0 0 auto;height:42vh;min-height:270px}
    #dash{max-height:none;overflow:visible;padding:9px 11px 18px}
    #brand{left:13px;top:11px;max-width:44vw} #brand h1{font-size:11px;letter-spacing:.03em;line-height:1.4} #brand p{display:none}
    #hud{right:9px;top:9px;min-width:0;padding:7px 9px} #hud .val b{font-size:11.5px}
    #hud .rel{display:none}
    #stageTools{right:9px;bottom:9px} #stageTools button{padding:5px 9px;font-size:10px}
    #srcBadge{left:13px;bottom:11px;font-size:9.5px}
    .dash-body{grid-template-columns:1fr;gap:9px}
    .chart-card{order:-1;min-height:206px}
    .dash-head{margin-bottom:8px;gap:7px}
    .dh-right{width:100%;justify-content:flex-end}
    .dh-right .t{display:inline}
    .chart-card .c-head{gap:6px}
    .c-title{font-size:10.5px;letter-spacing:.06em;gap:6px;white-space:nowrap;overflow:hidden}
    .legend{display:none}
    .c-range button{padding:2px 6px;font-size:9.5px;white-space:nowrap}
    .m-val b{font-size:26px}
    .stat-card{margin-top:9px}
    #toast{bottom:18px}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ 上：三维现场 ============ -->
  <section id="stage">
    <canvas id="c"></canvas>
    <div id="vig"></div>

    <div id="brand">
      <h1>智能仓储温湿度监控系统</h1>
      <p>STM32 · DHT11 · ESP8266 · ONENET · 3D TWIN</p>
    </div>

    <div id="hud">
      <div class="row"><span id="dot"></span><span id="stName">正在连接…</span></div>
      <div class="val"><span>T <b id="vT">--</b>℃</span><span>H <b id="vH">--</b>%</span></div>
      <div class="rel">
        <span class="chip" id="cK1">K1 风扇</span>
        <span class="chip" id="cK2">K2 加热</span>
      </div>
    </div>

    <div id="srcBadge"><i></i><span id="srcText">正在连接 OneNET…</span></div>

    <div id="stageTools">
      <button id="btnReset" title="重播装配动画">重置视角</button>
      <button id="btnInfo2" title="查看说明">说明</button>
    </div>

    <div id="loader">正在装配三维现场…</div>
  </section>

  <!-- ============ 下：监控面板 ============ -->
  <section id="dash">
    <div class="dash-head">
      <div class="dh-left">
        <span class="pill mute" id="connPill"><i></i><span id="connText">连接中</span></span>
        <span class="pill mute" id="modePill"><i></i><span id="modeText">--</span></span>
        <span class="pill mute" id="alarmPill"><i></i><span id="alarmText">等待数据</span></span>

<script>

<script>
/* =====================================================================
   OneNET 数据访问层
   ---------------------------------------------------------------------
   与手机 APP（assets/www/js/onenet.js）读取的是同一个产品、同一个设备、
   同一套物模型属性，所以网页端、APP 端、OLED 三处显示天然一致。

   鉴权方式：产品级 AccessKey → HMAC-SHA1 生成长期 token（et=2032-01-01）
   token 已按固件 NET/onenet/src/onenet.c 的算法离线算好写死在这里，
   浏览器端只做读取，不再做签名运算。
   ===================================================================== */
(function (global) {
  'use strict';

  // ===== 与固件 onenet.c 保持一致 =====
  var PRODUCT_ID  = 'xu4169n9Ey';
  var DEVICE_NAME = 'cangchu';
  var BASE_URL    = 'https://iot-api.heclouds.com';

  // 产品级 token（res=products/{pid}），有效期至 2032-01-01
  var TOKEN = 'version=2018-10-31&res=products%2Fxu4169n9Ey&et=1956499200&method=sha1&sign=C%2F1%2BdkgwufxdcrwS0OvdjlNBFQo%3D';

  function authHeader() {
    return { 'Authorization': TOKEN };
  }

  function toNum(v) {
    if (v === true) return 1;
    if (v === false) return 0;
    var n = Number(v);
    return isNaN(n) ? null : n;
  }

  function toBool(v) {
    if (v === true || v === 'true' || v === 1 || v === '1') return true;
    if (v === false || v === 'false' || v === 0 || v === '0') return false;
    return null;
  }

  /* -------------------------------------------------------------------
     读取设备最新属性值
     返回：{ temp, humi, k1, k2, mode, tmin, tmax, hmin, hmax,
             online, ts, raw }
     ts 为云端最后一次上报的毫秒时间戳
     ------------------------------------------------------------------- */
  async function getLatest() {
    var url = BASE_URL + '/thingmodel/query-device-property?product_id=' +
              encodeURIComponent(PRODUCT_ID) + '&device_name=' + encodeURIComponent(DEVICE_NAME);

    var res = await fetch(url, { method: 'GET', headers: authHeader(), cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var json = await res.json();
    if (json.code !== 0) throw new Error(json.msg || ('错误码 ' + json.code));

    var map = {};
    var latestTs = 0;
    (json.data || []).forEach(function (item) {
      map[item.identifier] = item.value;
      if (item.time && item.time > latestTs) latestTs = item.time;
    });

    var out = {
      temp: toNum(map.temp),
      humi: toNum(map.humi),
      k1: toBool(map.k1),
      k2: toBool(map.k2),
      mode: toBool(map.mode),
      tmin: toNum(map.temp_min),
      tmax: toNum(map.temp_max),
      hmin: toNum(map.humi_min),
      hmax: toNum(map.humi_max),
      ts: latestTs,
      raw: map,
      online: null
    };

    // 设备在线状态单独查一次（失败不影响主数据）
    try {
      var sres = await fetch(BASE_URL + '/device/detail?product_id=' + encodeURIComponent(PRODUCT_ID) +
        '&device_name=' + encodeURIComponent(DEVICE_NAME), { headers: authHeader(), cache: 'no-store' });
      if (sres.ok) {
        var sj = await sres.json();
        if (sj.code === 0 && sj.data) {
          // status: 1 在线 / 0 离线
          out.online = (sj.data.status == 1);
          if (sj.data.last_time) out.lastTime = sj.data.last_time;
        }
      }
    } catch (e) { /* 忽略 */ }

    return out;
  }

  /* -------------------------------------------------------------------
     下发属性（物模型 set-device-property）
     注意：改的是「期望值」，设备在线时固件收到 property/set 后执行并回传上报值
     ------------------------------------------------------------------- */
  async function setProps(params) {
    var res = await fetch(BASE_URL + '/thingmodel/set-device-property', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
      body: JSON.stringify({
        product_id: PRODUCT_ID,
        device_name: DEVICE_NAME,
        params: params
      })
    });
    var json = await res.json();
    if (json.code === 0) return { ok: true };
    // 10411 = 设备不在线：指令已入队但设备收不到
    return { ok: false, code: json.code, msg: json.msg || ('错误码 ' + json.code) };
  }

  /* -------------------------------------------------------------------
     历史数据（用于曲线开机回填）
     identifier: temp / humi
     返回 [{ t: 毫秒时间戳, v: 数值 }]，按时间升序
     ------------------------------------------------------------------- */
  async function getHistory(identifier, startMs, endMs, limit) {
    var url = BASE_URL + '/thingmodel/query-device-property-history?product_id=' +
              encodeURIComponent(PRODUCT_ID) + '&device_name=' + encodeURIComponent(DEVICE_NAME) +
              '&identifier=' + encodeURIComponent(identifier) +
              '&start_time=' + startMs + '&end_time=' + endMs +
              '&limit=' + (limit || 600);

    var res = await fetch(url, { headers: authHeader(), cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var json = await res.json();
    if (json.code !== 0) throw new Error(json.msg || ('错误码 ' + json.code));

    var list = (json.data && json.data.list) || [];
    return list.map(function (o) {
      return { t: o.time, v: toNum(o.value) };
    }).filter(function (o) { return o.v !== null; }).sort(function (a, b) { return a.t - b.t; });
  }

  global.OneNet = {
    PRODUCT_ID: PRODUCT_ID,
    DEVICE_NAME: DEVICE_NAME,
    token: TOKEN,
    getLatest: getLatest,
    setProps: setProps,
    getHistory: getHistory
  };
})(window);

</script>
<script>
/* =====================================================================
   智能仓储温湿度监控系统 —— 控制板 + 现场 微缩模型
   板型按实物复刻：STM32F103C8T6 核心板 / 2×继电器 / 2×接线端子 /
   DHT11 / 0.96" OLED / 4 按键 / 有源蜂鸣器 / Type-C 供电
   ===================================================================== */

const T = THREE;
const canvas = document.getElementById('c');
const QS = new URLSearchParams(location.search);

if (T.ColorManagement) {
  if ('enabled' in T.ColorManagement) T.ColorManagement.enabled = true;
  if ('legacyMode' in T.ColorManagement) T.ColorManagement.legacyMode = false;
}

/* ------------------------------ 全局 ------------------------------ */
let scene, camera, renderer, clock, root, control;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

/* 板子尺寸（世界单位） */
const BW = 9.2, BD = 6.8, BT = 0.16;
const BOARD_Y = 0.62;

/* 元件布局（板面坐标，原点为板中心，x 向右，z 向前） */
const L = {
  dht11: { x: -2.30, z: -2.50, w: 1.60, d: 1.05 },
  term1: { x: 1.35, z: -2.55, w: 1.15, d: 0.85 },
  term2: { x: 2.75, z: -2.55, w: 1.15, d: 0.85 },
  k1: { x: -1.55, z: -0.30, w: 2.25, d: 1.85 },
  k2: { x: 1.30, z: -0.30, w: 2.25, d: 1.85 },
  header: { x: -4.10, z: -0.80, w: 0.42, d: 3.10 },
  mcu: { x: -2.45, z: 2.10, w: 3.00, d: 1.80 },
  oled: { x: 1.90, z: 2.10, w: 2.15, d: 1.45 },
  buzzer: { x: 4.00, z: 2.70, w: 0.62, d: 0.62 },
  usbc: { x: 4.10, z: 1.35, w: 0.55, d: 0.90 },
  keys: [-1.65, -1.10, -0.55, 0.00]
};

/* ---------------------------------------------------------------------
   实时工况：不再是演示用的固定数组，而是由 OneNET 真实数据写入的对象。
   K1 = 通风风扇（继电器1）  K2 = PTC 陶瓷加热片（继电器2）
   dash.js 每 5s 调一次 Stage.setLive() 更新这里的目标值，
   updateState() 用 lerp 平滑过渡，所以数字变化是连续的、不跳变。
   --------------------------------------------------------------------- */
const LIVE = {
  name: '等待数据', sub: 'WAITING',
  t: 25, h: 55,          // 目标温湿度（云端真值）
  k1: 0, k2: 0,          // 目标继电器状态 0/1
  lv: 0,                 // 0 正常 / 1 预警 / 2 严重
  why: '正在连接 OneNET 云平台…'
};

const S = {
  mode: 0,
  curT: 25, curH: 55,     // 平滑显示值
  k1: 0, k2: 0,           // 继电器状态 0..1 平滑
  fan: 0, heat: 0,        // 执行器强度（fan←K1, heat←K2）
  lv: 0,                  // 报警等级 0/1/2 平滑
  intro: 0, introStart: 0, playing: true,
  auto: false, autoT: 0,
  uiHide: false
};

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

const COL = {
  pcb: 0x0b6b3e,
  pcbDark: 0x084f2e,
  relay: 0x2f6dc8,
  term: 0x2a63c0,
  mcu: 0x1d4f9c,
  silk: 0xeaf3ee,
  gold: 0xc9a227,
  black: 0x1a1e24,
  steel: 0x9aa4b0,
  fan: 0x17191d,
  heat: 0xd8d2c4,
  box: 0xa8875a,
  rack: 0x2f6f9e,
  ok: 0x35e0b0,
  warn: 0xffbf3c,
  crit: 0xff3b46,
  cool: 0x4fb0ff
};

/* ------------------------------ 初始化 ------------------------------ */
/* 舞台尺寸：3D 只占据页面上半部分的 #stage，不再铺满整屏 */
function stageW() { const s = document.getElementById('stage'); return Math.max(1, s ? s.clientWidth : innerWidth); }
function stageH() { const s = document.getElementById('stage'); return Math.max(1, s ? s.clientHeight : innerHeight); }
function stageAR() { return stageW() / stageH(); }

function initCore() {
  scene = new T.Scene();
  scene.background = new T.Color(0x06080d);
  scene.fog = new T.FogExp2(0x070b12, 0.011);

  camera = new T.PerspectiveCamera(34, stageAR(), 0.3, 300);

  renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(DPR);
  renderer.setSize(stageW(), stageH());
  if ('outputColorSpace' in renderer && T.SRGBColorSpace) renderer.outputColorSpace = T.SRGBColorSpace;
  else renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.NoToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;

  clock = new T.Clock();
  root = new T.Group();
  scene.add(root);

  setupLight();
  setupGradient();
  setupCamera();

  window.addEventListener('resize', () => {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(stageW(), stageH());
    fitView();
    control.tDist = BASE_DIST;
  });
}

/* 三渲二梯度 */
let GRAD;
function setupGradient() {
  const d = new Uint8Array([72, 130, 192, 236, 255]);
  GRAD = new T.DataTexture(d, d.length, 1, T.RedFormat);
  GRAD.needsUpdate = true;
  GRAD.minFilter = GRAD.magFilter = T.NearestFilter;
  GRAD.generateMipmaps = false;
}

let BASE_DIST = 28;
let HINT_Y = 4.82;
function fitView() {
  const a = stageAR();
  // 上半屏很扁（宽高比大）时收紧视角，让板子与货架占满画面而不是缩在中间
  if (a < 1.0) { camera.fov = 46; BASE_DIST = 36; HINT_Y = 6.3; }
  else if (a < 1.35) { camera.fov = 38; BASE_DIST = 31; HINT_Y = 5.6; }
  else if (a < 2.1) { camera.fov = 34; BASE_DIST = 26.5; HINT_Y = 6.3; }
  else if (a < 2.9) { camera.fov = 31; BASE_DIST = 25.0; HINT_Y = 6.0; }
  else { camera.fov = 30; BASE_DIST = 24.6; HINT_Y = 5.9; }
  camera.aspect = a;
  camera.updateProjectionMatrix();
  if (hintSprite) {
    if (a < 1.0) { hintSprite.position.set(0, HINT_Y, -0.6); hintSprite.scale.set(3.1, 1.1, 1); }
    else { hintSprite.position.set(0.4, HINT_Y, 1.4); hintSprite.scale.set(3.6, 1.29, 1); }
  }
}

function setupCamera() {
  fitView();
  control = {
    theta: 0.0, phi: 1.02, dist: BASE_DIST * 1.4,
    tTheta: 0.40, tPhi: 1.03, tDist: BASE_DIST,
    target: new T.Vector3(0, stageAR() < 1.0 ? 1.5 : (stageAR() > 2.1 ? 2.05 : 1.8), -1.4),
    dragging: false, px: 0, py: 0
  };
  canvas.addEventListener('pointerdown', e => {
    control.dragging = true; control.px = e.clientX; control.py = e.clientY;
    canvas.setPointerCapture(e.pointerId); document.body.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', e => {
    if (!control.dragging) return;
    const dx = e.clientX - control.px, dy = e.clientY - control.py;
    control.px = e.clientX; control.py = e.clientY;
    control.tTheta -= dx * 0.0055;
    control.tPhi = clamp(control.tPhi - dy * 0.004, 0.22, 1.42);
  });
  const up = () => { control.dragging = false; document.body.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    control.tDist = clamp(control.tDist * (1 + Math.sign(e.deltaY) * 0.08), BASE_DIST * 0.5, BASE_DIST * 2.4);
  }, { passive: false });
  let pd = 0;
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (pd) control.tDist = clamp(control.tDist * (pd / d), BASE_DIST * 0.5, BASE_DIST * 2.4);
      pd = d; control.dragging = false;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => { pd = 0; });
}

function updateCamera(dt) {
  const k = 1 - Math.pow(0.0016, dt);
  control.theta = lerp(control.theta, control.tTheta, k);
  control.phi = lerp(control.phi, control.tPhi, k);
  control.dist = lerp(control.dist, control.tDist, k);
  const sp = Math.sin(control.phi), cp = Math.cos(control.phi);
  camera.position.set(
    control.target.x + control.dist * sp * Math.sin(control.theta),
    control.target.y + control.dist * cp,
    control.target.z + control.dist * sp * Math.cos(control.theta)
  );
  camera.lookAt(control.target);
}

/* 灯光 */
let keyLight, rimLight, boardSpot, heatLight, fanLight, warnLight;
function setupLight() {
  scene.add(new T.HemisphereLight(0x7a9fd8, 0x0a0e16, 0.34));

  keyLight = new T.DirectionalLight(0xc8dcff, 0.95);
  keyLight.position.set(9, 16, 11);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(1536, 1536);
  const sc = keyLight.shadow.camera;
  sc.left = -14; sc.right = 14; sc.top = 14; sc.bottom = -14; sc.near = 1; sc.far = 50;
  keyLight.shadow.bias = -0.0008;
  keyLight.shadow.normalBias = 0.03;
  scene.add(keyLight);

  rimLight = new T.DirectionalLight(0x2f5ba8, 0.5);

  scene.add(rimLight);

  // 打在板子上的聚光（展示感）
  boardSpot = new T.SpotLight(0xdceaff, 1.05, 26, 0.66, 0.55, 1.2);
  boardSpot.position.set(1.5, 13, 7);
  boardSpot.target.position.set(0, 0.6, 0.5);
  scene.add(boardSpot);
  scene.add(boardSpot.target);

  // 加热片暖光（随功率）
  heatLight = new T.PointLight(0xff6a2a, 0, 9, 1.6);

}

/* ------------------------------ 材质 / 几何工具 ------------------------------ */
const matCache = new Map();
function toon(color, o) {
  const key = color + '|' + (o ? JSON.stringify(o) : '');
  if (!o || !o.unique) { const h = matCache.get(key); if (h) return h; }
  const m = new T.MeshToonMaterial({ color, gradientMap: GRAD });
  if (o) {
    if (o.emissive !== undefined) { m.emissive = new T.Color(o.emissive); m.emissiveIntensity = o.ei === undefined ? 1 : o.ei; }
    if (o.transparent) { m.transparent = true; m.opacity = o.opacity === undefined ? 0.6 : o.opacity; }
    if (o.side !== undefined) m.side = o.side;
    if (o.depthWrite !== undefined) m.depthWrite = o.depthWrite;
  }
  if (!o || !o.unique) matCache.set(key, m);
  return m;
}

const edgeMat = new T.LineBasicMaterial({ color: 0x0c1119, transparent: true, opacity: 0.45 });

function box(w, h, d, color, o) {
  o = o || {};
  const g = new T.BoxGeometry(w, h, d);
  const mesh = new T.Mesh(g, (color && color.isMaterial) ? color : toon(color, o.mo));
  mesh.castShadow = o.cast !== false;
  mesh.receiveShadow = o.recv !== false;
  if (o.edge && Math.max(w, h, d) > 0.5) mesh.add(new T.LineSegments(new T.EdgesGeometry(g), edgeMat));
  return mesh;
}
function cyl(rt, rb, h, color, seg, o) {
  o = o || {};
  const g = new T.CylinderGeometry(rt, rb, h, seg || 12);
  const mesh = new T.Mesh(g, (color && color.isMaterial) ? color : toon(color, o.mo));
  mesh.castShadow = o.cast !== false;
  mesh.receiveShadow = true;
  return mesh;
}
function put(obj, x, y, z, parent) { obj.position.set(x, y, z); (parent || scene).add(obj); return obj; }

/* 圆形粒子贴图（让 Points 变成柔和光点） */
let DOT_TEX = null;
function dotTexture() {
  if (DOT_TEX) return DOT_TEX;
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, 'rgba(255,255,255,1)');
  rg.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, 64, 64);
  DOT_TEX = new T.CanvasTexture(c);
  return DOT_TEX;
}

/* Canvas 屏幕 */
function makeScreen(w, h, draw, sw, sh, opts) {
  opts = opts || {};
  const cv = document.createElement('canvas');
  cv.width = sw || 256; cv.height = sh || 128;
  const ctx = cv.getContext('2d');
  const tex = new T.CanvasTexture(cv);
  if (T.sRGBEncoding) tex.encoding = T.sRGBEncoding;
  tex.minFilter = opts.smooth === false ? T.NearestFilter : T.LinearFilter;
  tex.magFilter = opts.smooth === false ? T.NearestFilter : T.LinearFilter;
  tex.generateMipmaps = false;
  const mesh = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({
    map: tex, transparent: !!opts.transparent, toneMapped: false,
    side: opts.side || T.FrontSide, depthWrite: opts.depthWrite !== false
  }));
  mesh.userData.screen = { cv, ctx, tex, draw };
  draw(ctx, cv.width, cv.height, {});
  return mesh;
}
function redraw(mesh, data) {
  const s = mesh.userData.screen;
  if (!s) return;
  s.draw(s.ctx, s.cv.width, s.cv.height, data || {});
  s.tex.needsUpdate = true;
}

/* 入场动画 */
const introParts = [];
function reg(obj, delay, drop, dur) {
  obj.userData.anim = { y0: obj.position.y, delay, drop: drop === undefined ? 3 : drop, dur: dur || 0.8 };
  introParts.push(obj);
  return obj;
}

  }));

/* =====================================================================
   2. PCB 主控板
   ===================================================================== */
let oledScreen, boardGroup, ledPower, ledStat, relayA, relayB, relayLightA, relayLightB, buzzerRings;
let armA, armB, coilGlowA, coilGlowB, relayLedA, relayLedB;

/* 板面坐标 → 画布坐标 */
function p2c(x, z, W, H) {
  return [(x + BW / 2) / BW * W, (z + BD / 2) / BD * H];
}
function sc(w, W) { return w / BW * W; }

/* 绘制 PCB 顶面（阻焊 + 走线 + 丝印 + 焊盘） */
function drawPCB(ctx, W, H) {
  // 阻焊底色
  const gd = ctx.createLinearGradient(0, 0, W, H);
  gd.addColorStop(0, '#06472a');
  gd.addColorStop(0.5, '#085231');
  gd.addColorStop(1, '#054029');
  ctx.fillStyle = gd;
  ctx.fillRect(0, 0, W, H);

  // 细微纹理
  for (let i = 0; i < 2600; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.014) + ')';
    ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2);
  }

  // 板框
  ctx.strokeStyle = 'rgba(220,240,225,0.55)';
  ctx.lineWidth = 3;
  ctx.strokeRect(6, 6, W - 12, H - 12);

  // 走线
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const trace = (pts, wdt) => {
    ctx.beginPath();
    pts.forEach((p, i) => {
      const c = p2c(p[0], p[1], W, H);
      i ? ctx.lineTo(c[0], c[1]) : ctx.moveTo(c[0], c[1]);
    });
    ctx.lineWidth = wdt || 5;
    ctx.strokeStyle = '#0d7040';
    ctx.stroke();
  };
  trace([[-2.45, 1.2], [-2.45, 0.4], [-1.55, -0.0], [-1.55, -1.3]], 6);
  trace([[-2.45, 1.2], [-2.45, 0.5], [0.4, 0.5], [1.30, -0.0], [1.30, -1.3]], 6);
  trace([[-1.5, 2.2], [-1.5, 1.6], [0.6, 1.6], [0.6, -1.0], [1.3, -1.2]], 5);
  trace([[-3.0, 2.9], [-3.4, 2.9], [-3.4, 1.8], [-4.0, 1.8]], 4);
  trace([[0.2, 2.9], [0.2, 3.0], [1.9, 3.0]], 4);
  trace([[1.35, -3.0], [1.35, -2.0], [-0.4, -2.0], [-0.4, -1.2]], 7);
  trace([[2.75, -3.0], [2.75, -1.9], [2.4, -1.9], [2.4, -1.2]], 7);
  trace([[-2.6, -1.9], [-2.6, -1.2]], 5);
  trace([[3.9, 2.2], [3.9, 1.9], [4.1, 1.9]], 4);
  trace([[-4.1, 0.9], [-3.4, 0.9], [-3.4, 1.4]], 5);

  // 过孔
  for (let i = 0; i < 46; i++) {
    const x = rand(0.06, 0.94) * W, y = rand(0.06, 0.94) * H;
    ctx.beginPath();
    ctx.arc(x, y, 3.2, 0, TAU);
    ctx.fillStyle = '#b9973a';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, TAU);
    ctx.fillStyle = '#062d1a';
    ctx.fill();
  }

  // 四角安装孔
  [[-4.28, -3.08], [4.28, -3.08], [-4.28, 3.08], [4.28, 3.08]].forEach(p => {
    const c = p2c(p[0], p[1], W, H);
    ctx.beginPath(); ctx.arc(c[0], c[1], 17, 0, TAU);
    ctx.fillStyle = '#c8a63c'; ctx.fill();
    ctx.beginPath(); ctx.arc(c[0], c[1], 11, 0, TAU);
    ctx.fillStyle = '#0a0d10'; ctx.fill();
  });

  // 元件丝印框
  const silkBox = (k, label, sub) => {
    const c = p2c(k.x - k.w / 2, k.z - k.d / 2, W, H);
    const w = sc(k.w, W), h = sc(k.d, H);
    ctx.strokeStyle = 'rgba(232,243,236,0.75)';
    ctx.lineWidth = 2;
    ctx.strokeRect(c[0], c[1], w, h);
    if (label) {
      ctx.fillStyle = 'rgba(232,243,236,0.92)';
      ctx.font = 'bold 17px monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText(label, c[0], c[1] - 4);
    }
    if (sub) {
      ctx.fillStyle = 'rgba(180,215,195,0.7)';
      ctx.font = '13px monospace';
      ctx.fillText(sub, c[0] + w + 8, c[1] + 14);
    }
  };
  silkBox(L.k1, 'K1', 'HEAT');
  silkBox(L.k2, 'K2', 'FAN');
  silkBox(L.dht11, 'DHT11');
  silkBox(L.term1, 'P1');
  silkBox(L.term2, 'P2');
  silkBox(L.oled, 'OLED');
  silkBox(L.mcu, 'STM32');
  silkBox(L.buzzer, 'BZ1');
  silkBox(L.usbc, 'USB');
  silkBox(L.header, 'IO');

  // 按键丝印
  ctx.strokeStyle = 'rgba(232,243,236,0.6)';
  L.keys.forEach((x, i) => {
    const c = p2c(x, 2.72, W, H);
    ctx.beginPath(); ctx.arc(c[0], c[1], 15, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(180,215,195,0.75)';
    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(['KEY1', 'KEY2', 'KEY3', 'KEY4'][i], c[0], c[1] + 30);
  });

  // 丝印大字
  ctx.fillStyle = 'rgba(232,243,236,0.9)';
  ctx.font = 'bold 27px "Microsoft YaHei"';
  ctx.textAlign = 'left';
  const t1 = p2c(-4.15, 2.95, W, H);
  ctx.fillText('智能仓储温湿度监控板', t1[0], t1[1]);
  ctx.fillStyle = 'rgba(190,220,200,0.62)';
  ctx.font = '13px monospace';
  ctx.fillText('WH-MONITOR-V1.2   2026', t1[0], t1[1] + 20);

  // 警示小三角
  const tp = p2c(3.55, -3.0, W, H);
  ctx.beginPath();
  ctx.moveTo(tp[0], tp[1] - 12);
  ctx.lineTo(tp[0] + 13, tp[1] + 9);
  ctx.lineTo(tp[0] - 13, tp[1] + 9);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(240,200,70,0.9)';
  ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(240,200,70,0.95)';
  ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
  ctx.fillText('!', tp[0], tp[1] + 7);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(240,200,70,0.8)';
  ctx.font = '12px monospace';
  ctx.fillText('CAUTION 5V', tp[0] + 20, tp[1] + 4);
}

function buildBoard() {
  const g = new T.Group();
  g.position.set(0, BOARD_Y, 0.9);
  g.rotation.x = 0.10;
  root.add(g);
  boardGroup = g;

  // 元件逐个落位的辅助
  const regEl = (o, d) => { reg(o, d, 1.25, 0.55); return o; };

  // PCB 基板（整体先落位）
  const pcbBase = new T.Group();
  g.add(pcbBase);
  const pcbMat = toon(COL.pcb);
  const substrate = box(BW, BT, BD, pcbMat, { edge: true });
  pcbBase.add(substrate);

  const face = makeScreen(BW, BD, drawPCB, 1152, 850, { smooth: true });
  face.rotation.x = -Math.PI / 2;
  face.position.y = BT / 2 + 0.003;
  pcbBase.add(face);

  const bottom = box(BW - 0.02, 0.02, BD - 0.02, COL.pcbDark, { cast: false, recv: false });
  bottom.position.y = -BT / 2 - 0.008;
  pcbBase.add(bottom);
  reg(pcbBase, 0.5, 2.2, 0.7);

  /* ---------- 继电器 K1 / K2 ---------- */
  const mkRelay = (k, idx) => {
    const rg = new T.Group();
    rg.position.set(k.x, BT / 2, k.z);
    g.add(rg);

    const W2 = k.w, H2 = 1.52, D2 = k.d, tk = 0.085;
    const shellMat = toon(0x2a63b8, { unique: true });

    // 底板
    const baseP = box(W2, 0.07, D2, 0x1b3a67, { cast: false });
    baseP.position.y = 0.035;
    rg.add(baseP);

    // 四侧板
    const side = (w, h, d, x, z) => {
      const m = box(w, h, d, shellMat, { edge: true });
      m.position.set(x, h / 2, z);
      rg.add(m);
    };
    side(W2, H2, tk, 0, -D2 / 2 + tk / 2);
    side(W2, H2, tk, 0, D2 / 2 - tk / 2);
    side(tk, H2, D2, -W2 / 2 + tk / 2, 0);
    side(tk, H2, D2, W2 / 2 - tk / 2, 0);

    // 顶板回字形（中间开观察窗）
    const fw = 0.36, topY = H2 - 0.06;
    const topP = (w, d, x, z) => {
      const m = box(w, 0.11, d, shellMat, { edge: false });
      m.position.set(x, topY, z);
      rg.add(m);
    };
    topP(W2, fw, 0, -D2 / 2 + fw / 2);
    topP(W2, fw, 0, D2 / 2 - fw / 2);
    topP(fw, D2 - fw * 2, -W2 / 2 + fw / 2, 0);
    topP(fw, D2 - fw * 2, W2 / 2 - fw / 2, 0);

    // 内部：线圈
    const coil = cyl(0.28, 0.28, 0.92, 0xc98a36, 14);
    coil.position.set(-0.62, 0.55, 0);
    rg.add(coil);
    const coilGlow = new T.Mesh(new T.CylinderGeometry(0.31, 0.31, 0.96, 14),
      new T.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0, toneMapped: false }));
    coilGlow.position.copy(coil.position);
    rg.add(coilGlow);

    // 内部：衔铁（可从顶部窗口看到）
    const arm = box(0.55, 0.10, 1.05, 0xdfe9f5, { cast: false });
    arm.position.set(0.10, 1.02, 0);
    rg.add(arm);

    // 内部：触点
    [[0.62, 0.6, -0.36], [0.62, 0.6, 0.36], [0.62, 0.3, 0]].forEach(p => {
      const ct = box(0.2, 0.13, 0.13, 0xd8b25a, { cast: false });
      ct.position.set(p[0], p[1], p[2]);
      rg.add(ct);
    });

    // 顶部丝印
    const label = makeScreen(W2 * 0.62, 0.25, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(245,252,255,0.95)';
      ctx.font = 'bold 26px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(idx === 0 ? 'K1' : 'K2', w / 2, h * 0.3);
      ctx.font = '17px monospace';
      ctx.fillStyle = 'rgba(235,246,255,0.75)';
      ctx.fillText('12V', w / 2, h * 0.74);
    }, 160, 64, { transparent: true });
    label.rotation.x = -Math.PI / 2;
    label.position.set(0, topY + 0.062, -D2 / 2 + fw / 2);
    rg.add(label);

    // 状态指示灯：焊接在顶板外沿，继电器吸合时点亮
    const ledMat = new T.MeshBasicMaterial({ color: 0x10262f, toneMapped: false });
    const stLed = new T.Mesh(new T.CylinderGeometry(0.115, 0.115, 0.07, 16), ledMat);
    stLed.position.set(-W2 / 2 + 0.30, topY + 0.095, D2 / 2 - fw / 2);
    rg.add(stLed);
    // 指示灯外圈微光
    const ledHalo = new T.Mesh(new T.CylinderGeometry(0.24, 0.24, 0.012, 20),
      new T.MeshBasicMaterial({ color: idx === 0 ? 0x4fd0ff : 0xff9a3c, transparent: true, opacity: 0, toneMapped: false }));
    ledHalo.position.set(-W2 / 2 + 0.30, topY + 0.135, D2 / 2 - fw / 2);
    rg.add(ledHalo);

    // 引脚
    [[-0.78, 0.62], [0.78, 0.62], [-0.78, -0.62], [0.78, -0.62]].forEach(p => {
      const pin = box(0.1, 0.12, 0.1, COL.gold, { cast: false });
      pin.position.set(p[0], 0.02, p[1]);
      rg.add(pin);
    });

    return { group: rg, arm, glow: coilGlow, shell: shellMat, led: stLed, halo: ledHalo, coil };
  };

  const r1 = mkRelay(L.k1, 0);
  const r2 = mkRelay(L.k2, 1);
  regEl(r1.group, 0.98);
  regEl(r2.group, 1.06);
  relayA = r1; relayB = r2;
  armA = r1.arm; armB = r2.arm;
  coilGlowA = r1.glow; coilGlowB = r2.glow;
  relayLedA = r1; relayLedB = r2;

  /* ---------- 接线端子 ---------- */
  const mkTerm = (k, tag, delay) => {
    const tg = new T.Group();
    tg.position.set(k.x, BT / 2, k.z);
    g.add(tg);
    const body = box(k.w, 0.78, k.d, COL.term, { edge: true });
    body.position.y = 0.39;
    tg.add(body);
    [-0.26, 0.26].forEach(o => {
      const screw = cyl(0.14, 0.14, 0.1, 0x2a2e35, 12);
      screw.position.set(o, 0.84, 0);
      tg.add(screw);
      const slot = box(0.2, 0.02, 0.03, 0x101318, { cast: false });
      slot.position.set(o, 0.9, 0);
      tg.add(slot);
      // 进线孔
      const hole = cyl(0.1, 0.1, 0.1, 0x0e1116, 10);
      hole.rotation.x = Math.PI / 2;
      hole.position.set(o, 0.38, -k.d / 2 - 0.03);
      tg.add(hole);
    });
    // 型号丝印
    const lb = makeScreen(0.7, 0.2, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(tag, w / 2, h / 2);
    }, 96, 28, { transparent: true });
    lb.rotation.x = -Math.PI / 2;
    lb.position.set(0, 0.79, 0);
    tg.add(lb);
    regEl(tg, delay);
  };
  mkTerm(L.term1, 'P1', 0.86);
  mkTerm(L.term2, 'P2', 0.9);

  /* ---------- DHT11 ---------- */
  const dh = new T.Group();
  dh.position.set(L.dht11.x, BT / 2, L.dht11.z);
  g.add(dh);
  const dhBody = box(1.55, 0.86, 1.0, 0x2f6fd0, { edge: true });
  dhBody.position.y = 0.43;
  dh.add(dhBody);
  // 正面格栅
  for (let i = 0; i < 4; i++) {
    const s = box(0.1, 0.5, 0.03, 0x0d1a2e, { cast: false });
    s.position.set(-0.5 + i * 0.33, 0.45, 0.51);
    dh.add(s);
  }
  const dhLabel = makeScreen(0.9, 0.2, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('DHT11', w / 2, h / 2);
  }, 128, 30, { transparent: true });
  dhLabel.rotation.x = -Math.PI / 2;
  dhLabel.position.set(0, 0.87, 0);
  dh.add(dhLabel);
  // 底部引脚
  for (let i = 0; i < 4; i++) {
    const p = box(0.07, 0.1, 0.07, COL.gold, { cast: false });
    p.position.set(-0.45 + i * 0.3, 0.03, -0.35);
    dh.add(p);
  }
  regEl(dh, 0.8);

  /* ---------- IO 排针 ---------- */
  const hd = new T.Group();
  hd.position.set(L.header.x, BT / 2, L.header.z);
  g.add(hd);
  const hdBody = box(0.44, 0.26, L.header.d, 0x14171c, { edge: false });
  hdBody.position.y = 0.13;
  hd.add(hdBody);
  const pinCount = 19;
  for (let i = 0; i < pinCount; i++) {
    const p = box(0.07, 0.34, 0.07, COL.gold, { cast: false });
    p.position.set(0, 0.3, -L.header.d / 2 + 0.11 + i * ((L.header.d - 0.22) / (pinCount - 1)));
    hd.add(p);
  }
  regEl(hd, 0.76);

  /* ---------- STM32 核心板 ---------- */
  const mcu = new T.Group();
  mcu.position.set(L.mcu.x, BT / 2, L.mcu.z);
  g.add(mcu);
  // 支撑排针
  [[-1.3, -0.7], [1.3, -0.7], [-1.3, 0.7], [1.3, 0.7]].forEach(p => {
    const st = box(0.12, 0.34, 0.12, 0x14171c, { cast: false });
    st.position.set(p[0], 0.17, p[1]);
    mcu.add(st);
  });
  const mcuPCB = box(L.mcu.w, 0.1, L.mcu.d, COL.mcu, { edge: true });
  mcuPCB.position.y = 0.38;
  mcu.add(mcuPCB);
  // 芯片
  const chip = box(0.72, 0.13, 0.72, 0x14171c, { cast: false });
  chip.position.set(-0.25, 0.49, -0.05);
  mcu.add(chip);
  // 晶振
  const xtal = cyl(0.11, 0.11, 0.22, 0xbfc9d4, 10);
  xtal.rotation.z = Math.PI / 2;
  xtal.position.set(0.55, 0.48, -0.42);
  mcu.add(xtal);
  // 复位键
  const rst = cyl(0.09, 0.09, 0.1, 0xd8483c, 10);
  rst.position.set(1.1, 0.48, 0.55);
  mcu.add(rst);
  // 两侧排针
  [-0.62, 0.62].forEach(z => {
    for (let i = 0; i < 10; i++) {
      const pin = box(0.06, 0.16, 0.06, COL.gold, { cast: false });
      pin.position.set(-1.3 + i * 0.29, 0.5, z);
      mcu.add(pin);
    }
  });
  // 丝印
  const mcuLabel = makeScreen(1.3, 0.28, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(230,240,255,0.92)';
    ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('STM32F103', w / 2, h / 2);
  }, 160, 34, { transparent: true });
  mcuLabel.rotation.x = -Math.PI / 2;
  mcuLabel.position.set(-0.35, 0.435, 0.58);
  mcu.add(mcuLabel);
  regEl(mcu, 1.14);

  /* ---------- OLED ---------- */
  const og = new T.Group();
  og.position.set(L.oled.x, BT / 2, L.oled.z);
  g.add(og);
  const oPCB = box(L.oled.w, 0.1, L.oled.d, 0x1b3f7d, { edge: true });
  oPCB.position.y = 0.06;
  og.add(oPCB);
  // 玻璃屏
  const glass = box(L.oled.w - 0.24, 0.05, L.oled.d - 0.24, 0x0a0d12, { cast: false });
  glass.position.y = 0.12;
  og.add(glass);
  oledScreen = makeScreen(L.oled.w - 0.34, L.oled.d - 0.34, drawOLED, 192, 108, { smooth: false });
  oledScreen.rotation.x = -Math.PI / 2;
  oledScreen.position.y = 0.152;
  og.add(oledScreen);
  // 四角安装孔
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(p => {
    const h = cyl(0.09, 0.09, 0.14, COL.gold, 10);
    h.position.set(p[0] * (L.oled.w / 2 - 0.12), 0.08, p[1] * (L.oled.d / 2 - 0.12));
    og.add(h);
  });
  regEl(og, 1.22);

  /* ---------- 按键 x4 ---------- */
  L.keys.forEach(x => {
    const kg = new T.Group();
    kg.position.set(x, BT / 2, 2.72);
    g.add(kg);
    const base = box(0.4, 0.12, 0.4, 0x22262c, { cast: false });
    base.position.y = 0.06;
    kg.add(base);
    const cap = cyl(0.16, 0.16, 0.14, 0xd8dde3, 12);
    cap.position.y = 0.19;
    kg.add(cap);
    const ring = cyl(0.19, 0.19, 0.04, 0x14171c, 12);
    ring.position.y = 0.11;
    kg.add(ring);
    regEl(kg, 1.3 + L.keys.indexOf(x) * 0.045);
  });

  /* ---------- 蜂鸣器 ---------- */
  const bz = new T.Group();
  bz.position.set(L.buzzer.x, BT / 2, L.buzzer.z);
  g.add(bz);
  const bzBody = cyl(0.31, 0.31, 0.42, 0x1a1e24, 16);
  bzBody.position.y = 0.21;
  bz.add(bzBody);
  const bzTop = cyl(0.29, 0.29, 0.03, 0x2a2f37, 16);
  bzTop.position.y = 0.43;
  bz.add(bzTop);
  const bzHole = cyl(0.06, 0.06, 0.04, 0x06080b, 10);
  bzHole.position.y = 0.45;
  bz.add(bzHole);
  regEl(bz, 1.36);

  // 声波环（严重报警时）
  buzzerRings = new T.Group();
  buzzerRings.position.set(L.buzzer.x, BT / 2 + 1.9, L.buzzer.z);
  g.add(buzzerRings);
  for (let i = 0; i < 3; i++) {
    const r = new T.Mesh(new T.TorusGeometry(0.4, 0.02, 5, 28),
      new T.MeshBasicMaterial({ color: 0xff5a5a, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false, toneMapped: false }));
    r.rotation.x = Math.PI / 2;
    r.userData.phase = i / 3;
    buzzerRings.add(r);
  }

  /* ---------- Type-C 与开关 ---------- */
  const usb = new T.Group();
  usb.position.set(L.usbc.x, BT / 2, L.usbc.z);
  g.add(usb);
  const usbShell = box(0.5, 0.2, 0.86, 0xc8d0d8, { edge: false });
  usbShell.position.y = 0.14;
  usb.add(usbShell);
  const usbHole = box(0.3, 0.1, 0.06, 0x0a0d12, { cast: false });
  usbHole.position.set(0, 0.14, 0.44);
  usb.add(usbHole);
  regEl(usb, 1.2);

  const sw = new T.Group();
  sw.position.set(L.usbc.x, BT / 2, 0.45);
  g.add(sw);
  const swBase = box(0.4, 0.18, 0.26, 0x2c323b, { cast: false });
  swBase.position.y = 0.1;
  sw.add(swBase);
  const swKnob = box(0.14, 0.16, 0.12, 0xd6dae0, { cast: false });
  swKnob.position.set(0, 0.2, 0);
  sw.add(swKnob);
  regEl(sw, 1.24);

  /* ---------- 电容 / 小元件 ---------- */
  [[0.45, -1.55, 0.16, 0.42], [0.85, -1.55, 0.16, 0.42], [-3.05, -0.95, 0.13, 0.34]].forEach(c => {
    const cap = cyl(c[2], c[2], c[3], 0x1d2b45, 12);
    cap.position.set(c[0], BT / 2 + c[3] / 2, c[1]);
    g.add(cap);
    const capTop = cyl(c[2], c[2], 0.02, 0xb9c6d4, 12);
    capTop.position.set(c[0], BT / 2 + c[3] + 0.01, c[1]);
    g.add(capTop);
  });
  // 贴片电阻
  for (let i = 0; i < 7; i++) {
    const r = box(0.16, 0.07, 0.08, 0x14171c, { cast: false });
    r.position.set(-4.05 + (i % 2) * 0.22, BT / 2 + 0.04, 1.05 + Math.floor(i / 2) * 0.2);
    g.add(r);
  }
  // 二极管
  const diode = box(0.3, 0.12, 0.16, 0x14171c, { cast: false });
  diode.position.set(3.0, BT / 2 + 0.06, 1.9);
  g.add(diode);

  /* ---------- 指示灯 ---------- */
  const mkLed = (x, z, color) => {
    const m = new T.Mesh(new T.SphereGeometry(0.075, 10, 8),
      new T.MeshBasicMaterial({ color, toneMapped: false }));
    m.position.set(x, BT / 2 + 0.06, z);
    g.add(m);
    return m;
  };
  ledPower = mkLed(-3.95, 2.55, 0x1f6b52);
  ledStat = mkLed(-3.65, 2.55, 0x3a1d21);

  return g;
}

/* OLED 屏内容 */
function drawOLED(ctx, w, h) {
  const m = LIVE;
  const lv = S.lv;
  const sc = lv === 0 ? '#35e0b0' : lv < 1.5 ? '#ffbf3c' : '#ff4b55';

  ctx.fillStyle = '#03080c';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(90,150,180,0.3)';
  ctx.lineWidth = 2;
  ctx.strokeRect(2, 2, w - 4, h - 4);

  ctx.textBaseline = 'top';
  ctx.fillStyle = '#7fa8bd';
  ctx.font = 'bold 13px monospace';
  ctx.fillText('WAREHOUSE MONITOR', 8, 8);

  ctx.fillStyle = '#e6f6ff';
  ctx.font = 'bold 21px monospace';
  ctx.fillText('T:' + S.curT.toFixed(1) + 'C', 8, 26);
  ctx.fillText('H:' + S.curH.toFixed(0) + '%', 104, 26);

  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = '#7fa8bd';
  ctx.fillText('MODE:' + m.sub.slice(0, 4), 8, 54);
  // K1 = 风扇（青）K2 = 加热（橙）
  ctx.fillStyle = S.k1 > 0.5 ? '#5fc8ff' : '#3a4a55';
  ctx.fillText('K1:' + (S.k1 > 0.5 ? 'ON' : 'OF'), 8, 72);
  ctx.fillStyle = S.k2 > 0.5 ? '#ffb347' : '#3a4a55';
  ctx.fillText('K2:' + (S.k2 > 0.5 ? 'ON' : 'OF'), 78, 72);

  // 状态块
  ctx.fillStyle = sc;
  ctx.fillRect(138, 54, 46, 16);
  ctx.fillStyle = '#03080c';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(lv < 0.5 ? 'OK' : lv < 1.5 ? 'WARN' : 'CRIT', 143, 57);

  // 闪烁边框
  if (lv > 0.5) {
    ctx.strokeStyle = sc;
    ctx.globalAlpha = 0.3 + 0.4 * Math.abs(Math.sin(performance.now() * (0.005 + lv * 0.006)));
    ctx.lineWidth = 2;
    ctx.strokeRect(2, 2, w - 4, h - 4);
    ctx.globalAlpha = 1;
  }
}

/* =====================================================================
   3. 执行器：风扇 / PTC 加热片
   ===================================================================== */
let fanBlades, fanRing, fanGlow, airLines, fanGroup;
let heaterGroup, heaterCore, heaterGlow, heatWaves;

function buildFan() {
  const g = new T.Group();
  g.position.set(6.3, 0, -1.0);
  g.rotation.y = 0.72;
  root.add(g);
  fanGroup = g;

  // 支架
  const foot = box(1.5, 0.12, 1.5, 0x2a3039, { edge: false });
  foot.position.y = 0.06;
  g.add(foot);
  const post = cyl(0.13, 0.16, 2.6, 0x4a525c, 10);
  post.position.y = 1.36;
  g.add(post);

  // 风扇本体
  const fg = new T.Group();
  fg.position.y = 2.75;
  fg.rotation.x = -0.1;
  g.add(fg);

  const FS = 3.05;   // 外框边长
  const bw = 0.42;
  // 四边框
  [[0, FS / 2 - bw / 2, FS, bw], [0, -FS / 2 + bw / 2, FS, bw],
   [-FS / 2 + bw / 2, 0, bw, FS - bw * 2], [FS / 2 - bw / 2, 0, bw, FS - bw * 2]].forEach(b => {
    const m = box(b[2], b[3], bw + 0.1, 0x24282e, { edge: false });
    m.position.set(b[0], b[1], 0);
    fg.add(m);
  });
  // 内圈
  const ring = new T.Mesh(new T.TorusGeometry(1.24, 0.085, 8, 32), toon(0x3a424c));
  ring.position.z = 0.18;
  fg.add(ring);
  fanRing = ring;

  // 扇叶
  const blades = new T.Group();
  blades.position.z = 0.1;
  fg.add(blades);
  fanBlades = blades;
  for (let i = 0; i < 7; i++) {
    const b = box(1.10, 0.06, 0.44, 0x4c5663, { edge: false, cast: false });
    b.position.set(Math.cos(i * TAU / 7) * 0.78, Math.sin(i * TAU / 7) * 0.78, 0);
    b.rotation.z = i * TAU / 7 + 0.5;
    b.rotation.y = 0.5;
    blades.add(b);
  }
  // 中心轴
  const hub = cyl(0.42, 0.42, 0.3, 0x14171c, 18);
  hub.rotation.x = Math.PI / 2;
  hub.position.z = 0.12;
  fg.add(hub);
  const hubCap = cyl(0.24, 0.24, 0.06, 0x3a4149, 16);
  hubCap.rotation.x = Math.PI / 2;
  hubCap.position.z = 0.28;
  fg.add(hubCap);

  // 转动光晕（高速时）
  const glow = new T.Mesh(new T.RingGeometry(0.5, 1.4, 32),
    new T.MeshBasicMaterial({ color: 0x7cc8ff, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false, toneMapped: false }));
  glow.position.z = 0.19;
  fg.add(glow);
  fanGlow = glow;

  // 四个安装孔
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(p => {
    const h = cyl(0.1, 0.1, bw + 0.14, 0x0e1116, 8);
    h.rotation.x = Math.PI / 2;
    h.position.set(p[0] * 1.5, p[1] * 1.5, 0);
    fg.add(h);
  });

  // 气流线
  const air = new T.Group();
  air.position.z = 0.55;
  fg.add(air);
  airLines = [];
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * TAU;
    const r = 0.35 + Math.random() * 1.1;
    const line = new T.Mesh(new T.PlaneGeometry(0.04, 1.15),
      new T.MeshBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false, toneMapped: false }));
    line.position.set(Math.cos(a) * r, Math.sin(a) * r, 0);
    line.userData = { t: Math.random(), r: r, a: a };
    air.add(line);
    airLines.push(line);
  }

  reg(g, 1.28, 2.6, 0.85);
  return g;
}

function buildHeater() {
  const g = new T.Group();
  g.position.set(-6.4, 0, -1.0);
  g.rotation.y = 0.5;
  root.add(g);
  heaterGroup = g;

  const foot = box(1.5, 0.12, 1.5, 0x262c35, { edge: false });
  foot.position.y = 0.06;
  g.add(foot);
  [-0.42, 0.42].forEach(x => {
    const p = cyl(0.06, 0.07, 1.35, 0x4a525c, 8);
    p.position.set(x, 0.78, 0);
    g.add(p);
  });

  const hg = new T.Group();
  hg.position.y = 1.95;
  g.add(hg);

  // 陶瓷发热芯（夹在散热片中间）
  heaterCore = box(1.82, 1.55, 1.42, new T.MeshBasicMaterial({ color: 0xd2cabb, toneMapped: false }), { cast: false });
  hg.add(heaterCore);

  // 波纹铝散热片（沿 x 叠放，正面看是密集竖栅）
  for (let i = 0; i < 11; i++) {
    const fin = box(0.065, 1.88, 1.95, 0xa9b4c0, { edge: false, cast: false });
    fin.position.x = -0.99 + i * 0.198;
    hg.add(fin);
  }
  // 上下铝框
  [-0.99, 0.99].forEach(y => {
    const rail = box(2.1, 0.1, 2.0, 0x8b96a3, { edge: false });
    rail.position.y = y;
    hg.add(rail);
  });
  // 两端电极耳
  [-1.08, 1.08].forEach(x => {
    const ear = box(0.1, 0.62, 0.42, 0xc9a227, { edge: false });
    ear.position.set(x, 0.05, 0);
    hg.add(ear);
  });

  // 发热光晕
  heaterGlow = new T.Mesh(new T.PlaneGeometry(3.0, 3.0), new T.MeshBasicMaterial({
    color: 0xff5a1e, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false, toneMapped: false
  }));
  heaterGlow.position.z = 1.02;
  hg.add(heaterGlow);

  // 热浪粒子
  const N = 44;
  const pos = new Float32Array(N * 3);
  const meta = [];
  for (let i = 0; i < N; i++) {
    pos[i * 3] = rand(-0.9, 0.9);
    pos[i * 3 + 1] = rand(-0.9, 1.1);
    pos[i * 3 + 2] = rand(0.1, 0.9);
    meta.push({ v: rand(0.4, 1.0), a: Math.random() * TAU });
  }
  const hgeo = new T.BufferGeometry();
  hgeo.setAttribute('position', new T.BufferAttribute(pos, 3));
  const hm = new T.PointsMaterial({
    color: 0xff7a3a, size: 0.62, map: dotTexture(), transparent: true, opacity: 0,
    depthWrite: false, blending: T.AdditiveBlending, toneMapped: false, sizeAttenuation: true
  });
  const pts = new T.Points(hgeo, hm);
  pts.frustumCulled = false;
  hg.add(pts);
  heatWaves = { pts, pos, meta, n: N };

  // 标识
  const tag = makeScreen(1.4, 0.34, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,190,120,0.95)';
    ctx.font = 'bold 24px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PTC 加热', w / 2, h / 2);
  }, 190, 46, { transparent: true });
  tag.position.set(0, -1.35, 0.9);
  hg.add(tag);

  reg(g, 1.42, 2.6, 0.85);
  return g;
}

/* =====================================================================
   4. 仓储环境（货架 + 纸箱）
   ===================================================================== */
let rackGroup, wetBoxes = [];

function buildRack() {
  const g = new T.Group();
  g.position.set(0, 0, -6.0);
  root.add(g);

  const RW = 8.6, RH = 4.8, RD = 2.2;
  // 立柱
  [[-RW / 2, -RD / 2], [RW / 2, -RD / 2], [-RW / 2, RD / 2], [RW / 2, RD / 2]].forEach(c => {
    const p = box(0.14, RH, 0.14, COL.rack, { edge: false });
    p.position.set(c[0], RH / 2, c[1]);
    g.add(p);
  });

  const levels = [0.55, 2.0, 3.45];
  levels.forEach((ly, li) => {
    const beam1 = box(RW + 0.16, 0.12, 0.1, COL.rack, { edge: false });
    beam1.position.set(0, ly, -RD / 2);
    g.add(beam1);
    const beam2 = beam1.clone(); beam2.position.z = RD / 2; g.add(beam2);
    const deck = box(RW, 0.07, RD, 0x5c6674, { cast: false });
    deck.position.set(0, ly + 0.09, 0);
    g.add(deck);

    // 货物
    const n = 3 + (li % 2);
    for (let i = 0; i < n; i++) {
      const cw = rand(0.85, 1.15), ch = rand(0.7, 1.0), cd = rand(0.75, 0.95);
      const bx = box(cw, ch, cd, i % 3 === 0 ? 0xb08e5e : (i % 3 === 1 ? 0x9c7c4e : 0xc0a074), { edge: false });
      bx.position.set(-RW / 2 + 1.0 + i * (RW - 2.0) / Math.max(1, n - 1) + rand(-0.08, 0.08),
        ly + 0.13 + ch / 2, rand(-0.1, 0.1));
      bx.rotation.y = rand(-0.07, 0.07);
      g.add(bx);
      wetBoxes.push(bx);
      // 打包带
      const tape = box(cw + 0.01, ch * 0.72, 0.08, 0x8a6c3f, { cast: false });
      tape.position.copy(bx.position);
      tape.position.z += cd / 2 - 0.01;
      g.add(tape);
    }
  });

  // 顶部标牌
  const sign = makeScreen(3.0, 0.85, (ctx, w, h) => {
    ctx.fillStyle = '#13202c'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#3fe3c4'; ctx.lineWidth = 3; ctx.strokeRect(3, 3, w - 6, h - 6);
    ctx.fillStyle = '#7fe8d4'; ctx.font = 'bold 32px "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('A-01 常温库区', w / 2, h / 2);
  }, 300, 84);
  sign.position.set(0, RH + 0.55, 0.2);
  g.add(sign);
  const sBack = box(3.15, 0.95, 0.12, 0x1a222c, { edge: false });
  sBack.position.set(0, RH + 0.55, 0.12);
  g.add(sBack);

  // 环境测点（挂在货架里的 DHT11 节点）
  const nodeG = new T.Group();
  nodeG.position.set(2.6, 3.1, 1.0);
  g.add(nodeG);
  const nodeBox = box(0.42, 0.56, 0.3, 0xe8eef5, { edge: true });
  nodeG.add(nodeBox);
  for (let i = 0; i < 3; i++) {
    const s = box(0.26, 0.03, 0.02, 0x9aa6b5, { cast: false });
    s.position.set(0, -0.12 + i * 0.11, 0.16);
    nodeG.add(s);
  }
  const nodeLed = box(0.06, 0.06, 0.02, new T.MeshBasicMaterial({ color: 0x35e0b0, toneMapped: false }), { cast: false });
  nodeLed.position.set(0.12, 0.2, 0.16);
  nodeG.add(nodeLed);
  nodeG.userData.led = nodeLed;

  // 托盘
  [[-3.2, 0.02, 2.6], [3.4, -0.3, 2.8]].forEach(p => {
    const pg = new T.Group();
    pg.position.set(p[0], 0, p[2]);
    g.add(pg);
    for (let i = 0; i < 3; i++) {
      const b = box(1.5, 0.09, 0.22, 0x8f6f45, { cast: false });
      b.position.set(0, 0.1, -0.5 + i * 0.5);
      pg.add(b);
    }
    const deck = box(1.5, 0.07, 1.2, 0xa8875a, { cast: false });
    deck.position.y = 0.19;
    pg.add(deck);
  });

  reg(g, 0.5, 2.8, 0.85);
  rackGroup = g;
  return g;
}

/* =====================================================================
   5. 连线与数据流
   ===================================================================== */
let wireGroup, dataCurve, dataPts, dataPos, dataMeta;

function buildWires() {
  const g = new T.Group(); root.add(g);

  const mkWire = (pts, color, r) => {
    const curve = new T.CatmullRomCurve3(pts.map(p => new T.Vector3(p[0], p[1], p[2])));
    const geo = new T.TubeGeometry(curve, 40, r || 0.055, 5, false);
    const m = new T.Mesh(geo, new T.MeshBasicMaterial({ color, toneMapped: false }));
    g.add(m);
    return m;
  };

  // 板子 → 加热片（红/黑：从 P1 端子引出，绕过后场）
  mkWire([[1.35, 0.80, -1.68], [0.2, 0.78, -2.55], [-2.4, 0.62, -2.95], [-4.9, 0.55, -2.70], [-6.1, 1.20, -1.95], [-6.45, 1.85, -1.45]], 0xd4402e, 0.058);
  mkWire([[1.35, 0.74, -1.72], [0.1, 0.68, -2.70], [-2.5, 0.50, -3.10], [-5.0, 0.44, -2.85], [-6.2, 1.05, -2.05], [-6.5, 1.70, -1.52]], 0x1a1e24, 0.058);

  // 板子 → 风扇（红/黑：从 P2 端子引出）
  mkWire([[2.75, 0.80, -1.68], [4.1, 0.72, -2.50], [5.5, 0.90, -2.35], [6.25, 1.50, -1.85], [6.38, 2.05, -1.52]], 0xd4402e, 0.058);
  mkWire([[2.75, 0.74, -1.72], [4.2, 0.62, -2.68], [5.6, 0.78, -2.55], [6.35, 1.38, -2.0], [6.45, 1.92, -1.60]], 0x1a1e24, 0.058);

  // 数据流：货架 → 板子（沿空中，用粒子表示）
  dataCurve = new T.CatmullRomCurve3([
    new T.Vector3(2.6, 3.1, -5.0),
    new T.Vector3(2.3, 2.9, -3.9),
    new T.Vector3(1.9, 2.4, -2.6),
    new T.Vector3(1.5, 1.6, -1.2),
    new T.Vector3(1.35, 1.05, -1.55)
  ]);

  const N = 26;
  dataPos = new Float32Array(N * 3);
  dataMeta = [];
  for (let i = 0; i < N; i++) dataMeta.push({ t: i / N });
  const dg = new T.BufferGeometry();
  dg.setAttribute('position', new T.BufferAttribute(dataPos, 3));
  dataPts = new T.Points(dg, new T.PointsMaterial({
    color: 0x35e0b0, size: 0.19, map: dotTexture(), transparent: true, opacity: 0.85,
    depthWrite: false, blending: T.AdditiveBlending, toneMapped: false, sizeAttenuation: true
  }));
  dataPts.frustumCulled = false;
  g.add(dataPts);

  reg(g, 1.85, 1.8, 0.7);
  wireGroup = g;
  return g;
}

/* =====================================================================
   6. 悬浮状态标签
   ===================================================================== */
let hintSprite;
function buildHint() {
  const cv = document.createElement('canvas');
  cv.width = 620; cv.height = 220;
  const tex = new T.CanvasTexture(cv);
  if (T.sRGBEncoding) tex.encoding = T.sRGBEncoding;
  const mat = new T.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false, depthTest: false, toneMapped: false });
  hintSprite = new T.Sprite(mat);
  hintSprite.scale.set(3.6, 1.29, 1);
  hintSprite.position.set(0.4, 6.3, 1.4);
  hintSprite.renderOrder = 999;
  hintSprite.userData = { cv, ctx: cv.getContext('2d'), tex };
  scene.add(hintSprite);
  if (stageAR() < 1.0) { hintSprite.position.set(0, HINT_Y, -0.6); hintSprite.scale.set(3.1, 1.1, 1); }
  drawHint();
}

function drawHint() {
  if (!hintSprite) return;
  const { cv, ctx, tex } = hintSprite.userData;
  const W = cv.width, H = cv.height;
  const m = LIVE;
  const lv = S.lv;
  const col = lv < 0.5 ? '#35e0b0' : lv < 1.5 ? '#ffbf3c' : '#ff4b55';

  ctx.clearRect(0, 0, W, H);

  // 圆角底板
  const r = 24, x0 = 10, y0 = 16, w0 = W - 20, h0 = H - 56;
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.arcTo(x0 + w0, y0, x0 + w0, y0 + h0, r);
  ctx.arcTo(x0 + w0, y0 + h0, x0, y0 + h0, r);
  ctx.arcTo(x0, y0 + h0, x0, y0, r);
  ctx.arcTo(x0, y0, x0 + w0, y0, r);
  ctx.closePath();
  ctx.fillStyle = 'rgba(8,13,20,0.86)';
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.globalAlpha = lv < 0.5 ? 0.7 : 0.5 + 0.5 * Math.abs(Math.sin(performance.now() * 0.006));
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // 左侧色条
  ctx.fillStyle = col;
  ctx.fillRect(x0 + 1, y0 + 1, 5, h0 - 2);

  // 标题
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 40px "Microsoft YaHei"';
  ctx.fillText(m.name, x0 + 26, y0 + 36);

  ctx.fillStyle = col;
  ctx.font = 'bold 20px monospace';
  ctx.fillText(m.sub, x0 + 26, y0 + 72);

  // 原因
  ctx.fillStyle = 'rgba(190,215,235,0.92)';
  ctx.font = '21px "Microsoft YaHei"';
  ctx.fillText(m.why, x0 + 26, y0 + 106);

  // 右下继电器状态（K1 风扇 / K2 加热）
  ctx.textAlign = 'right';
  ctx.font = 'bold 19px monospace';
  ctx.fillStyle = S.k1 > 0.5 ? '#5fc8ff' : 'rgba(120,140,160,0.7)';
  ctx.fillText('K1 ' + (S.k1 > 0.5 ? 'ON' : 'OFF'), x0 + w0 - 22, y0 + 36);
  ctx.fillStyle = S.k2 > 0.5 ? '#ffb347' : 'rgba(120,140,160,0.7)';
  ctx.fillText('K2 ' + (S.k2 > 0.5 ? 'ON' : 'OFF'), x0 + w0 - 22, y0 + 66);

  // 指向小三角
  ctx.beginPath();
  ctx.moveTo(W / 2 - 18, y0 + h0);
  ctx.lineTo(W / 2 + 18, y0 + h0);
  ctx.lineTo(W / 2, H - 8);
  ctx.closePath();
  ctx.fillStyle = 'rgba(8,13,20,0.86)';
  ctx.fill();

  tex.needsUpdate = true;
}

/* =====================================================================
   7. 状态更新与联动
   ===================================================================== */
const el = {
  dot: document.getElementById('dot'),
  stName: document.getElementById('stName'),
  vT: document.getElementById('vT'),
  vH: document.getElementById('vH'),
  cK1: document.getElementById('cK1'),
  cK2: document.getElementById('cK2'),
  vig: document.getElementById('vig'),
  hud: document.getElementById('hud')
};

let uiTick = 0;

/* 演示用的工况切换在新版里已经去掉：场景完全由云端数据驱动。
   保留同名空函数，避免旧调用点报错。 */
function setMode() { S.auto = false; }

function updateState(dt) {
  const m = LIVE;
  const k = 1 - Math.pow(0.0025, dt);

  S.curT = lerp(S.curT, m.t, k);
  S.curH = lerp(S.curH, m.h, k);
  S.k1 = lerp(S.k1, m.k1, 1 - Math.pow(0.002, dt));
  S.k2 = lerp(S.k2, m.k2, 1 - Math.pow(0.002, dt));
  S.lv = lerp(S.lv, m.lv, 1 - Math.pow(0.004, dt));
  if (Math.abs(S.lv - m.lv) < 0.003) S.lv = m.lv;

  const t = performance.now() * 0.001;
  const lv = S.lv;
  const col = new T.Color(COL.ok).lerp(new T.Color(COL.warn), clamp(lv, 0, 1));
  if (lv > 1) col.lerp(new T.Color(COL.crit), clamp(lv - 1, 0, 1));
  const colHex = '#' + col.getHexString();
  const blink = 0.5 + 0.5 * Math.sin(t * (3 + lv * 5));

  /* ---- 继电器动作 ---- */
  // 硬件对应关系：K1 → 通风风扇；K2 → PTC 陶瓷加热片
  S.fan  = lerp(S.fan,  S.k1, 1 - Math.pow(0.006, dt));
  S.heat = lerp(S.heat, S.k2, 1 - Math.pow(0.006, dt));

  if (armA) armA.position.y = 0.95 - S.k1 * 0.09;
  if (armB) armB.position.y = 0.95 - S.k2 * 0.09;
  if (coilGlowA) coilGlowA.material.opacity = S.k1 * (0.45 + 0.35 * blink);
  if (coilGlowB) coilGlowB.material.opacity = S.k2 * (0.45 + 0.35 * blink);

  /* 状态指示灯 + 外壳辉光：让"哪一路继电器吸合"在模型外部一眼可见 */
  if (relayLedA) {
    const k1v = S.k1;
    relayLedA.led.material.color.setHex(0x10262f).lerp(new T.Color(0x6fe4ff), k1v);
    relayLedA.halo.material.opacity = k1v * (0.4 + 0.28 * Math.sin(t * 5));
    relayLedA.shell.emissive.setHex(0x4fd0ff).multiplyScalar(k1v * 0.45);
    if (relayLedA.coil) relayLedA.coil.material.color.setHex(0x6b4a1e).lerp(new T.Color(0xffa54a), k1v);
  }
  if (relayLedB) {
    const k2v = S.k2;
    relayLedB.led.material.color.setHex(0x2a2118).lerp(new T.Color(0xffb347), k2v);
    relayLedB.halo.material.opacity = k2v * (0.4 + 0.28 * Math.sin(t * 5 + 1.2));
    relayLedB.shell.emissive.setHex(0xff9a3c).multiplyScalar(k2v * 0.45);
    if (relayLedB.coil) relayLedB.coil.material.color.setHex(0x6b4a1e).lerp(new T.Color(0xffa54a), k2v);
  }

  /* ---- LED ---- */
  if (ledPower) ledPower.material.color.setHex(0x2fd6a4).multiplyScalar(0.8 + 0.2 * Math.sin(t * 2));
  if (ledStat) {
    const c = lv < 0.5 ? 0x1f4a3e : (lv < 1.5 ? 0xffbf3c : 0xff3b46);
    ledStat.material.color.setHex(c).multiplyScalar(lv < 0.5 ? 0.5 : (0.45 + 0.75 * blink));
  }

  /* ---- 加热片 ---- */
  if (heaterCore) {
    const hot = S.heat;
    const c = new T.Color(0xcfc8b8).lerp(new T.Color(0xff3a0e), clamp(hot * 1.15, 0, 1));
    heaterCore.material.color.copy(c);
    const pulse = 0.85 + 0.15 * Math.sin(t * 6);
    heaterCore.material.color.multiplyScalar(hot > 0.02 ? pulse : 1);
  }
  if (heaterGlow) heaterGlow.material.opacity = S.heat * (0.09 + 0.07 * Math.sin(t * 4));
  if (heatLight) {
    heatLight.intensity = S.heat * (0.9 + 0.5 * Math.sin(t * 5));
    heatLight.color.setHex(0xff5e28);
  }
  // 热浪
  if (heatWaves) {
    const { pos, meta, n, pts } = heatWaves;
    pts.material.opacity = S.heat * 0.72;
    pts.material.size = 0.5 + S.heat * 0.3;
    for (let i = 0; i < n; i++) {
      pos[i * 3 + 1] += dt * meta[i].v * (0.5 + S.heat * 1.6);
      pos[i * 3] += Math.sin(t * 1.6 + meta[i].a) * dt * 0.5;
      if (pos[i * 3 + 1] > 2.4) {
        pos[i * 3 + 1] = -1.1;
        pos[i * 3] = rand(-1.1, 1.1);
        pos[i * 3 + 2] = rand(0.35, 1.1);
      }
    }
    pts.geometry.attributes.position.needsUpdate = true;
  }

  /* ---- 风扇 ---- */
  if (fanBlades) fanBlades.rotation.z -= dt * (2 + S.fan * 34);
  if (fanGlow) fanGlow.material.opacity = S.fan * (0.1 + 0.06 * Math.sin(t * 8));
  if (fanLight) fanLight.intensity = 0.25 + S.fan * 0.9;
  if (airLines) {
    airLines.forEach(l => {
      l.userData.t += dt * (0.5 + S.fan * 2.6);
      if (l.userData.t > 1) l.userData.t -= 1;
      const q = l.userData.t;
      const r = l.userData.r * (0.4 + q * 0.7);
      l.position.x = Math.cos(l.userData.a) * r;
      l.position.y = Math.sin(l.userData.a) * r;
      l.position.z = 0.3 + q * 2.6;
      l.scale.y = 0.6 + q * 1.4;
      l.material.opacity = S.fan * Math.sin(Math.PI * q) * 0.38;
    });
  }

  /* ---- 数据流粒子 ---- */
  if (dataCurve && dataPts) {
    const lvlCol = lv < 0.5 ? new T.Color(0x35e0b0) : (lv < 1.5 ? new T.Color(0xffbf3c) : new T.Color(0xff3b46));
    dataPts.material.color.copy(lvlCol);
    dataPts.material.opacity = 0.55 + 0.35 * (1 - lv * 0.4);
    const v = new T.Vector3();
    dataMeta.forEach((mm, i) => {
      mm.t = (mm.t + dt * 0.22) % 1;
      dataCurve.getPointAt(mm.t, v);
      dataPos[i * 3] = v.x + Math.sin(t * 2 + i) * 0.05;
      dataPos[i * 3 + 1] = v.y + Math.cos(t * 1.7 + i) * 0.05;
      dataPos[i * 3 + 2] = v.z;
    });
    dataPts.geometry.attributes.position.needsUpdate = true;
  }

  /* ---- 货架受潮 ---- */
  wetBoxes.forEach((b, i) => {
    const wet = clamp((S.curH - 60) / 30, 0, 1);
    const base = i % 3 === 0 ? 0xb08e5e : (i % 3 === 1 ? 0x9c7c4e : 0xc0a074);
    const c = new T.Color(base).lerp(new T.Color(0x5a4a34), wet * 0.55);
    b.material.color.copy(c);
  });

  /* ---- 蜂鸣器声波 ---- */
  if (buzzerRings) {
    const on = clamp((lv - 1.1) / 0.9, 0, 1);
    buzzerRings.children.forEach(r => {
      r.userData.phase += dt * (0.55 + on * 0.5);
      if (r.userData.phase > 1) r.userData.phase -= 1;
      const q = r.userData.phase;
      const sc2 = 1 + q * 3.6;
      r.scale.set(sc2, sc2, sc2);
      r.material.opacity = (1 - q) * 0.42 * on;
    });
    buzzerRings.visible = on > 0.02;
  }

  /* ---- 环境泛光 ---- */
  if (warnLight) {
    warnLight.color.copy(lv < 0.5 ? new T.Color(0x35e0b0) : (lv < 1.5 ? new T.Color(0xffbf3c) : new T.Color(0xff3b46)));
    warnLight.intensity = lv * (1.1 + 2.4 * blink) * (lv < 0.5 ? 0 : 1);
    warnLight.position.set(Math.sin(t * 1.2) * 1.2, 4.4, 1.6 + Math.cos(t * 1.2) * 0.8);
  }
  el.vig.style.opacity = lv > 1 ? (0.24 + 0.3 * blink) : (lv > 0.05 ? lv * 0.07 : 0);

  /* ---- 板面反光随状态变色 ---- */
  if (baseGroup && baseGroup.userData.refl) {
    baseGroup.userData.refl.material.color.copy(col);
    baseGroup.userData.refl.material.opacity = 0.03 + lv * 0.05;
  }

  /* ---- 屏幕重绘 ---- */
  if (performance.now() - uiTick > 170) {
    uiTick = performance.now();
    if (oledScreen) redraw(oledScreen);
    drawHint();
    const lvI = Math.round(lv);
    el.dot.style.background = colHex;
    el.dot.style.boxShadow = `0 0 0 3px ${colHex}26, 0 0 ${8 + lv * 10}px ${colHex}`;
    el.stName.textContent = m.name;
    el.stName.style.color = lv < 0.5 ? '#eaf4ff' : colHex;
    el.vT.textContent = S.curT.toFixed(1);
    el.vH.textContent = S.curH.toFixed(0);
    el.cK1.classList.toggle('on', S.k1 > 0.5);
    el.cK2.classList.toggle('on', S.k2 > 0.5);
    el.cK2.classList.add('cool');
    el.hud.style.borderColor = lv < 0.5 ? 'rgba(120,170,220,.16)' : colHex + '44';
  }

  /* ---- 悬浮标签 ---- */
  if (hintSprite) {
    /* 正常态隐藏，报警时浮现（避免遮挡主体） */
    const want = clamp((lv - 0.06) / 0.5, 0, 1);
    hintSprite.material.opacity = lerp(hintSprite.material.opacity || 0, want, 1 - Math.pow(0.05, dt));
    hintSprite.visible = hintSprite.material.opacity > 0.02;
    hintSprite.position.y = HINT_Y + Math.sin(t * 0.9) * 0.06;
  }
}

/* =====================================================================
   8. 入场组装
   ===================================================================== */
function updateIntro() {
  const t = (performance.now() - S.introStart) / 1000;
  S.intro = t;
  introParts.forEach(o => {
    const a = o.userData.anim;
    const p = clamp((t - a.delay) / a.dur, 0, 1);
    if (p <= 0) { o.visible = false; return; }
    o.visible = true;
    const e = easeOutBack(p);
    o.position.y = a.y0 + (1 - e) * a.drop;
    o.scale.setScalar(0.88 + 0.12 * clamp(e, 0, 1.05));
  });
  control.tDist = lerp(BASE_DIST * 1.4, BASE_DIST, easeOutCubic(clamp(t / 2.4, 0, 1)));
  if (t > 3.4) S.playing = false;
}

/* =====================================================================
   9. 主循环
   ===================================================================== */
let shadowTick = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (S.playing) updateIntro();
  else if (S.intro < 3.2) { S.intro = 3.2; }

  updateCamera(dt);
  updateState(dt);

  shadowTick++;
  if (shadowTick % 5 === 0) renderer.shadowMap.needsUpdate = true;

  renderer.render(scene, camera);
}

/* =====================================================================
   10. 交互与说明
